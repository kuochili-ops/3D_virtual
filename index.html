<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Ready to Record</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #media-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; z-index: 1; }
        #bg-image, #bg-video { flex-shrink: 0; object-fit: contain; transform-origin: center; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: auto; }
        #app-ui { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); transition: transform 0.3s; }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; font-weight: bold; }
        .ui-content { padding: 10px 0 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .mode-btn { background: #444; color: #ccc; }
        .active-mode { background: #ffaa00 !important; color: #000 !important; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 35%; }
        #rec-btn { width: 45px; height: 45px; border: 3px solid #fff; background: red; border-radius: 50%; }
        .hint { color: #ffaa00; font-size: 10px; position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>

<div class="hint" id="ui-hint">📍 調整路徑模式</div>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted style="display:none;"></video>
    <img id="bg-image" style="display:none;">
</div>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 收合選單 (錄影用)</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES">
            <input type="color" id="colorPicker" value="#ffffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff;">更換字型</button>
        </div>
        <div class="ui-row">
            <button class="btn mode-btn active-mode" id="modePath">📍 3D 路徑</button>
            <button class="btn mode-btn" id="modePhoto">🖼️ 背景調整</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 鏡頭</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 照片</button>
            <button class="btn" id="toggleGuide" style="background:#444; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class ARRecordingModule {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
            
            this.bgParams = { scale: 1, x: 0, y: 0 };
            this.controlMode = 'path'; 
            this.helperVisible = true; // 輔助工具顯示狀態
            this.fontIdx = 0;
            this.fontStyles = ['900 400px "Noto Serif TC"', '400 400px "Zhi Mang Xing"', '400 400px "Ma Shan Zheng"', '900 400px sans-serif'];

            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 200, 1000);

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;

            this.grid = new THREE.GridHelper(2000, 25, 0x00ffff, 0x333333);
            this.scene.add(this.grid);

            this.points = [
                this.createPoint(new THREE.Vector3(300, 50, 0), 0x00ff00),   
                this.createPoint(new THREE.Vector3(0, 300, 200), 0xffff00), 
                this.createPoint(new THREE.Vector3(-300, 50, 0), 0xff0000)   
            ];

            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => this.orbit.enabled = true);

            // UI 事件
            document.getElementById('modePath').onclick = () => this.setMode('path');
            document.getElementById('modePhoto').onclick = () => this.setMode('photo');
            document.getElementById('camBtn').onclick = () => this.startCamera();
            document.getElementById('openAlbum').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.loadPhoto(e.target.files[0]);
            document.getElementById('fontToggle').onclick = () => { this.fontIdx = (this.fontIdx + 1) % 4; this.updateText(); };
            document.getElementById('toggleUI').onclick = () => document.getElementById('app-ui').classList.toggle('collapsed');
            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('colorPicker').oninput = () => this.updateText();
            
            // 👁️ 隱藏功能綁定
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();

            this.setupBGTouch();
            this.updateText();
            this.animate();
        }

        toggleHelpers() {
            this.helperVisible = !this.helperVisible;
            this.grid.visible = this.helperVisible;
            this.points.forEach(p => p.visible = this.helperVisible);
            document.getElementById('toggleGuide').style.background = this.helperVisible ? "#444" : "#00ffff";
            document.getElementById('toggleGuide').innerText = this.helperVisible ? "👁️" : "🙈";
        }

        setMode(m) {
            this.controlMode = m;
            const isPath = (m === 'path');
            document.getElementById('modePath').classList.toggle('active-mode', isPath);
            document.getElementById('modePhoto').classList.toggle('active-mode', !isPath);
            document.getElementById('ui-hint').innerText = isPath ? "📍 調整路徑模式" : "🖼️ 背景調整模式";
            this.drag.enabled = isPath;
            this.orbit.enabled = isPath;
        }

        // ... (背景縮放與相機控制邏輯不變)
        async startCamera() {
            const v = document.getElementById('bg-video');
            const i = document.getElementById('bg-image');
            i.style.display = 'none'; v.style.display = 'block';
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            v.srcObject = s; this.activeEl = v; this.bgParams = { scale: 1, x: 0, y: 0 }; this.updateBG();
        }

        loadPhoto(file) {
            const i = document.getElementById('bg-image');
            const v = document.getElementById('bg-video');
            v.style.display = 'none'; i.style.display = 'block';
            i.src = URL.createObjectURL(file); this.activeEl = i; this.bgParams = { scale: 1, x: 0, y: 0 }; this.updateBG();
        }

        updateBG() { if (this.activeEl) this.activeEl.style.transform = `translate(${this.bgParams.x}px, ${this.bgParams.y}px) scale(${this.bgParams.scale})`; }

        setupBGTouch() {
            let lx, ly, ld;
            this.renderer.domElement.addEventListener('touchstart', (e) => {
                if (this.controlMode !== 'photo') return;
                lx = e.touches[0].clientX; ly = e.touches[0].clientY;
                if (e.touches.length === 2) ld = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            });
            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (this.controlMode !== 'photo') return;
                if (e.touches.length === 1) {
                    this.bgParams.x += e.touches[0].clientX - lx; this.bgParams.y += e.touches[0].clientY - ly;
                    lx = e.touches[0].clientX; ly = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    this.bgParams.scale *= (d / ld); ld = d;
                }
                this.updateBG();
            });
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(35), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 }));
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        async updateText() {
            await document.fonts.ready;
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = this.fontStyles[this.fontIdx];
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 20;
                ctx.strokeText(c, 256, 256);
                ctx.fillStyle = document.getElementById('colorPicker').value;
                ctx.fillText(c, 256, 256);
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 20; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05, side: THREE.DoubleSide }));
                    m.position.z = -j * 2; m.material.opacity = (1 - j/20);
                    g.add(m);
                }
                g.userData.tOffset = -i * 0.12; this.scene.add(g); this.charGroups.push(g);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.orbit.update();
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups?.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    window.onload = () => new ARRecordingModule();
</script>
</body>
</html>
