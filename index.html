<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>純 3D 向量立體中文跑馬燈</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        input { padding: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <input type="text" id="textInput" value="立體" placeholder="輸入中文...">
        <button id="updateBtn">生成 3D 字</button>
        <div style="font-size: 12px; margin-top: 5px; color: #0ff;">此模式將文字轉為 3D 向量模型 (真正的側邊厚度)</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // --- 1. 環境設定 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 15);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 強光才能顯現側面的金屬感/立體感
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // --- 2. 解決中文字體關鍵：加載中文字體 JSON ---
        // 註：這是一個包含常用中文路徑的字體庫，若檔案較大請稍候
        const loader = new FontLoader();
        let currentFont;
        let charMeshes = [];

        // 這裡使用一個開源的繁體中文字體 JSON (Microsoft JhengHei 轉製)
        const CHINESE_FONT_URL = 'https://raw.githubusercontent.com/Ken-Yamanaka/three.js-chinese-font/master/fonts/MicrosoftJhengHei_Regular.json';

        loader.load(CHINESE_FONT_URL, (font) => {
            currentFont = font;
            createMarquee("立體厚度");
            animate();
        });

        // --- 3. 逐字生成立體幾何體 ---
        function createMarquee(text) {
            charMeshes.forEach(m => scene.remove(m));
            charMeshes = [];

            const chars = text.split('');
            chars.forEach((char, i) => {
                const geometry = new TextGeometry(char, {
                    font: currentFont,
                    size: 2,
                    height: 0.8,         // 這裡就是真正的文字厚度！
                    curveSegments: 4,    // 減少面數提升效能
                    bevelEnabled: true,  // 倒角增加光影細節
                    bevelThickness: 0.1,
                    bevelSize: 0.05
                });

                // 讓每個字元的重心居中
                geometry.computeBoundingBox();
                
                const material = new THREE.MeshPhongMaterial({ 
                    color: 0x00ffff, 
                    specular: 0xffffff, 
                    shininess: 100 
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                
                // 初始排隊位置
                mesh.position.set(10 + (i * 3), 3, 2);
                scene.add(mesh);
                charMeshes.push({
                    mesh: mesh,
                    state: 'linear' // linear 或 turning
                });
            });
        }

        // --- 4. 動畫邏輯 ---
        function animate() {
            requestAnimationFrame(animate);
            
            charMeshes.forEach((item, i) => {
                const m = item.mesh;
                
                if (m.position.x > -5) {
                    m.position.x -= 0.06;
                } else {
                    // 轉彎動畫：旋轉 + 深度位移
                    if (m.rotation.y > -Math.PI / 2) {
                        m.rotation.y -= 0.1;
                    }
                    m.position.z -= 0.08;
                }

                // 循環重置
                if (m.position.z < -10) {
                    m.position.set(10 + (charMeshes.length * 0.5), 3, 2);
                    m.rotation.y = 0;
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = () => {
            if(currentFont) createMarquee(document.getElementById('textInput').value);
        };
    </script>
</body>
</html>
