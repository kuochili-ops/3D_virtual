<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Anamorphic Billboard</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        /* 隱藏所有介面，專注於 3D 效果 */
    </style>
</head>
<body>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class ShinjukuVisionApp {
        constructor() {
            this.config = {
                text: "新宿裸眼3D視覺錯視看板效果",
                color: "#00ffcc",
                speed: 0.05,
                depth: 50, // 增加厚度強化轉彎時的側邊視覺
                fontSize: 300
            };
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // --- 關鍵：鎖定照片中的拍攝角度 ---
            // x:45 (右側), y:35 (上方俯瞰), z:60 (遠距離產生廣角感)
            this.camera.position.set(45, 35, 60);
            this.camera.lookAt(-5, 5, 0); // 鏡頭對準轉角中心

            this.scene.add(new THREE.AmbientLight(0xffffff, 3.5));
            this.buildBoard();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = this.config.text.split('');
            const geometry = new THREE.PlaneGeometry(8, 8);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {};
                    color.getHSL(hsl);
                    if (j > 0) {
                        hsl.l *= (0.1 + 0.4 * Math.pow(1 - j/this.config.depth, 1.5));
                    } else { hsl.l = 1.0; }
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.15
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.08); 
                    if (j === 0) m.scale.set(1.1, 1.1, 1);
                    group.add(m);
                }

                const spacing = 7;
                // 設定起點在右側牆壁深處
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', 
                    xStart: 60 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 6, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 25; // 轉彎半徑加大，模仿照片中貓咪跨越轉角的弧度
            const cornerX = 0;

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s;
                    if (g.position.x <= cornerX) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    const slow = 1 - (Math.sin(g.userData.angle) * 0.5);
                    g.userData.angle += (s * slow / R);
                    
                    if (g.userData.angle < Math.PI / 2) {
                        // 旋轉動線：從 X-Z 平面轉向 Z-X 平面
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall';
                    }
                } else {
                    g.position.z -= s; // 往左側遠方遊走
                }

                if (g.position.z < -100) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    g.position.set(g.userData.xStart, 6, g.userData.zStart);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    new ShinjukuVisionApp();
</script>
</body>
</html>
