<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 鞋盒仰望看板 App</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(0, 0, 0, 0.8); padding: 12px; border-radius: 15px;
            display: flex; gap: 10px; border: 1px solid #00ffff; width: 90%; max-width: 400px;
        }
        input { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #222; color: #fff; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #00ffff; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui">
    <input type="text" id="textInput" placeholder="請輸入文字..." value="穿壁而出 右轉沒入">
    <button id="updateBtn">更新</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class ShoesBoxApp {
        constructor() {
            this.config = { speed: 0.07, depth: 50, fontSize: 320, color: "#00ffcc" };
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // --- 妳要求的「鞋盒底部仰望」視角 ---
            // 相機放在底部中心，往上方(Y+)與深處(Z-)仰望
            this.camera.position.set(0, -30, 5); 
            this.camera.lookAt(0, 5, -20); 

            this.scene.add(new THREE.AmbientLight(0xffffff, 4));
            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(8, 8);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {};
                    color.getHSL(hsl);
                    if (j > 0) hsl.l *= (0.1 + 0.5 * Math.pow(1 - j/this.config.depth, 1.5));
                    else hsl.l = 1.0;
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.2, side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.1); 
                    if (j === 0) m.scale.set(1.1, 1.1, 1);
                    group.add(m);
                }

                // 起點：遠端牆面 (Z 軸深處)
                const spacing = 8;
                group.userData = { 
                    angle: 0, 
                    state: 'long-wall', 
                    xStart: 18, // 右側牆壁
                    zStart: -70 - (i * spacing) 
                };
                group.position.set(group.userData.xStart, 5, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 18; 
            const turnZ = 15; // 靠近使用者的轉折點

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'long-wall') {
                    g.position.z += s; 
                    if (g.position.z >= turnZ) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    g.userData.angle += (s / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.z = turnZ + R * Math.sin(g.userData.angle);
                        g.position.x = 18 - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = g.userData.angle;
                    } else {
                        g.userData.state = 'other-long-wall';
                    }
                } else {
                    g.position.x -= s; // 沒入另一側牆
                }

                if (g.position.x < -45) {
                    g.userData.state = 'long-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    // 自動排到最後一個字後面重生
                    const lastZ = Math.min(...this.charGroups.map(ch => ch.position.z));
                    g.position.set(18, 5, lastZ - 8);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new ShoesBoxApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
