<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Path Editor App</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #app-ui {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 12px; border: 1px solid #00ffff;
            display: flex; flex-direction: column; gap: 8px; width: 220px;
        }
        input { padding: 8px; border-radius: 6px; border: none; background: #222; color: #fff; }
        #hint { 
            position: absolute; bottom: 20px; width: 100%; text-align: center; 
            color: #00ffff; font-size: 13px; pointer-events: none; text-shadow: 0 0 5px #000;
        }
    </style>
</head>
<body>

<div id="app-ui">
    <input type="text" id="textInput" value="MERCEDES-BENZ">
    <div style="color: #ccc; font-size: 11px; margin-top: 5px;">* 拖動畫面中的發光球來改變路徑</div>
</div>
<div id="hint">拖動起點、轉點、終點球體來規劃文字動線</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class PathEditorApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            this.points = []; // 存儲三個控制球
            this.curve = null;
            
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            this.camera.position.set(80, 50, 100);
            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;

            this.scene.add(new THREE.AmbientLight(0xffffff, 3));

            // --- 創建三個控制球 (起點, 轉折點, 終點) ---
            const p1 = this.createPoint(new THREE.Vector3(70, 0, 0), "START");
            const p2 = this.createPoint(new THREE.Vector3(0, 0, 0), "PIVOT");
            const p3 = this.createPoint(new THREE.Vector3(0, 0, -70), "END");
            this.points = [p1, p2, p3];

            // 拖拽功能
            this.drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => {
                this.orbit.enabled = true;
                this.updatePath();
            });
            this.drag.addEventListener('drag', () => this.updatePath());

            this.updatePath();
            this.updateText();

            document.getElementById('textInput').oninput = () => this.updateText();
            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        createPoint(pos, name) {
            const geo = new THREE.SphereGeometry(2, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.userData.name = name;
            this.scene.add(mesh);
            return mesh;
        }

        updatePath() {
            // 使用 QuadraticBezierCurve 產生平滑圓角
            this.curve = new THREE.QuadraticBezierCurve3(
                this.points[0].position,
                this.points[1].position,
                this.points[2].position
            );

            // 更新視覺化線條
            if (this.line) this.scene.remove(this.line);
            const curvePoints = this.curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
            const material = new THREE.LineBasicMaterial({ color: 0x00ffff });
            this.line = new THREE.Line(geometry, material);
            this.scene.add(this.line);
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || " ";
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(10, 10);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                for (let j = 0; j < 40; j++) {
                    const color = new THREE.Color(0xe0e0e0);
                    color.multiplyScalar(0.2 + 0.8 * Math.pow(1 - j/40, 1.5));
                    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, color: color, alphaTest: 0.2, side: THREE.DoubleSide });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.1);
                    group.add(m);
                }
                group.userData = { t: -i * 0.08 }; // 每個字的初始進度感
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold 320px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.orbit.update();

            const speed = 0.005;
            this.charGroups.forEach(g => {
                g.userData.t += speed;
                if (g.userData.t > 1) g.userData.t = 0;

                if (g.userData.t >= 0) {
                    const pos = this.curve.getPointAt(g.userData.t);
                    const tangent = this.curve.getTangentAt(g.userData.t);
                    g.position.copy(pos);
                    // 讓文字始終面向行進方向（甩尾感）
                    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent);
                    g.rotation.x = 0; g.rotation.z = 0;
                } else {
                    g.position.set(999,999,999); // 隱藏尚未出發的字
                }
            });

            this.renderer.render(this.scene, this.camera);
        }
    }

    new PathEditorApp();
</script>
</body>
</html>
