<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Studio - Ultimate Controls</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .ui-row { width: 90%; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { background: #000; border: 2px solid #00ffff; color: #fff; padding: 12px; border-radius: 8px; width: 60%; font-size: 16px; }
        #rec-btn { width: 65px; height: 65px; border-radius: 50%; border: 4px solid #fff; background: red; cursor: pointer; }
        #rec-btn.recording { border-radius: 12px; background: #fff; }
        .btn { background: #00ffff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted style="display:none;"></video>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="ui-row">
        <input type="text" id="textInput" value="愛到你心驚驚">
        <button class="btn" id="updateBtn">確認更新</button>
    </div>
    <div class="ui-row">
        <button class="btn" id="startCam" style="background:#fff;">1. 開啟相機</button>
        <button class="btn" id="toggleGuide" style="background:#ff00ff; color:#fff;">顯示/隱藏控制球</button>
    </div>
    <div id="rec-btn"></div>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class FinalARApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
            this.charGroups = [];
            this.init();
        }

        async init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 0, 300);

            // 強化版控制球：座標更集中在畫面，方便手指操作
            this.points = [
                this.createPoint(new THREE.Vector3(60, -40, 0), 0x00ff00),  // 起點 (綠)
                this.createPoint(new THREE.Vector3(0, 60, 0), 0xffff00),   // 轉角 (黃)
                this.createPoint(new THREE.Vector3(-60, -40, 0), 0xff0000) // 終點 (紅)
            ];

            // 確保 DragControls 綁定正確
            this.dragControls = new DragControls(this.points, this.camera, this.renderer.domElement);
            
            // 互動綁定
            document.getElementById('startCam').onclick = () => this.initCamera();
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('toggleGuide').onclick = () => {
                this.points.forEach(p => p.visible = !p.visible);
            };
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecording(e.target);

            this.updateText();
            this.animate();
        }

        async initCamera() {
            try {
                const video = document.getElementById('video-source');
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.play();
                this.scene.background = new THREE.VideoTexture(video);
            } catch (err) { alert("無法開啟相機，請檢查權限"); }
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(15), // 增大尺寸
                new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9, depthTest: false })
            );
            m.position.copy(pos);
            m.renderOrder = 999; // 強制置頂渲染
            this.scene.add(m);
            return m;
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * 0.25; 
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 25; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(25, 25), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 0.3;
                m.material.color.setScalar(0.4 + 0.6 * (1 - j/25));
                g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    const tan = curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tan));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecording(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                const stream = this.renderer.domElement.captureStream(30);
                this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = 'ar_fixed.webm'; a.click();
                };
                this.recorder.start();
                btn.classList.add('recording');
            } else {
                this.recorder.stop();
                btn.classList.remove('recording');
            }
        }
    }
    new FinalARApp();
</script>
</body>
</html>
