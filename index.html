<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 極光看板 (穩定版)</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #ui {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.85); padding: 12px; border-radius: 8px; color: white;
            border: 1px solid #444; width: 240px; font-size: 12px;
        }
        .row { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        input[type="text"] { width: 130px; padding: 4px; background: #222; border: 1px solid #666; color: white; }
        input[type="range"] { width: 110px; }
        button { 
            width: 100%; padding: 8px; margin-top: 5px; background: #00ffff; 
            border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="row">文字 <input type="text" id="textInput" value="基隆市府安排免費接駁車"></div>
    <div class="row">顏色 <input type="color" id="colorPicker" value="#00ffff"></div>
    <div class="row">速度 <input type="range" id="speedSlider" min="0.01" max="0.1" step="0.01" value="0.04"></div>
    <div class="row">厚度 <input type="range" id="depthSlider" min="5" max="40" step="5" value="20"></div>
    <button id="updateBtn">套用並修復</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class FlipBoardApp {
        constructor() {
            this.config = { text: "", startColor: "", baseSpeed: 0.04, radius: 15, depth: 20 };
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 500);
            this.renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false }); // 關閉反鋸齒節省效能
            this.charGroups = [];
            this.sharedTextures = {};
            
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(1); // 強制 1:1 像素，防止高解析度面板崩潰
            document.body.appendChild(this.renderer.domElement);
            this.camera.position.set(35, 20, 40);
            this.camera.lookAt(0, 5, 0);

            this.scene.add(new THREE.AmbientLight(0xffffff, 2));
            this.update();
            
            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            this.config.text = document.getElementById('textInput').value;
            this.config.startColor = document.getElementById('colorPicker').value;
            this.config.baseSpeed = parseFloat(document.getElementById('speedSlider').value);
            this.config.depth = parseInt(document.getElementById('depthSlider').value);
            this.buildBoard();
        }

        createTexture(char) {
            const res = 256; // 再次降低解析度以確保手機絕對穩定
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${res*0.6}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard() {
            // 徹底清理舊資源
            this.charGroups.forEach(g => {
                g.children.forEach(c => {
                    c.material.map.dispose();
                    c.material.dispose();
                });
                this.scene.remove(g);
            });
            this.charGroups = [];

            const chars = this.config.text.split('');
            const geometry = new THREE.PlaneGeometry(4, 4);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.startColor);
                    const hsl = {};
                    color.getHSL(hsl);
                    hsl.h += (j / this.config.depth) * 0.08;
                    hsl.l *= (j === 0 ? 1 : 0.2 + 0.5 * Math.pow(1 - j/this.config.depth, 1.5));
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, color: color });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.12); // 增加間距讓較少的層數看起來依然厚
                    group.add(m);
                }

                const xOffset = i * 4.5;
                group.userData = { angle: 0, state: 'straight', xStart: 30 + xOffset, zStart: (Math.random()-0.5)*4 };
                group.position.set(group.userData.xStart, 5, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 15;
            this.charGroups.forEach(g => {
                let s = this.config.baseSpeed;
                if (g.position.x > 0 && g.userData.state === 'straight') {
                    g.position.x -= s;
                } else if (g.userData.state !== 'done') {
                    g.userData.state = 'turning';
                    const slow = 1 - (Math.sin(g.userData.angle) * 0.5);
                    g.userData.angle += (s * slow / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = -R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else { g.userData.state = 'done'; }
                } else {
                    g.position.z -= s;
                }
                if (g.position.z < -60) {
                    g.position.set(g.userData.xStart, 5, g.userData.zStart);
                    g.rotation.y = 0; g.userData.angle = 0; g.userData.state = 'straight';
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new FlipBoardApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
