<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 真立體跑馬燈 - 偵錯版</title>
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; color: white; }
        #status { position: absolute; bottom: 20px; left: 20px; color: #0ff; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; }
        input { padding: 8px; border: none; }
        button { padding: 8px; cursor: pointer; background: #00ffff; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <input type="text" id="textInput" value="立體中文" placeholder="輸入文字...">
        <button id="updateBtn">更新 3D 文字</button>
    </div>
    <div id="status">正在初始化 3D 場景...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        const statusEl = document.getElementById('status');

        // --- 1. 場景基礎 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 20);
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x111111);
        document.body.appendChild(renderer.domElement);

        // 燈光 (非常重要，否則 3D 側面會全黑)
        const light1 = new THREE.DirectionalLight(0xffffff, 2);
        light1.position.set(10, 20, 10);
        scene.add(light1);
        const light2 = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(light2);

        // 輔助網格 (讓你確認場景有在運作)
        scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));

        // --- 2. 字體載入 ---
        const loader = new FontLoader();
        let currentFont = null;
        let charMeshes = [];

        // 使用相對穩定的網址 (這是 Google Noto Sans TC 的轉製 JSON)
        const fontUrl = 'https://raw.githubusercontent.com/Mr-S0m30n3/three-fonts/master/fonts/noto/noto_sans_tc_regular.json';

        statusEl.innerText = "正在下載中文字體檔 (約 5MB)，請稍候...";

        loader.load(
            fontUrl, 
            (font) => {
                currentFont = font;
                statusEl.innerText = "字體載入成功！";
                createMarquee(document.getElementById('textInput').value);
                animate();
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                if (percent) statusEl.innerText = `載入中: ${percent}%`;
            },
            (err) => {
                statusEl.innerText = "字體載入失敗，請檢查網路連接。";
                console.error(err);
            }
        );

        // --- 3. 逐字生成 (帶有厚度) ---
        function createMarquee(text) {
            charMeshes.forEach(m => scene.remove(m));
            charMeshes = [];

            const chars = text.split('');
            chars.forEach((char, i) => {
                const geometry = new TextGeometry(char, {
                    font: currentFont,
                    size: 2,
                    height: 1, // 真正的厚度
                    curveSegments: 4,
                    bevelEnabled: true,
                    bevelThickness: 0.1,
                    bevelSize: 0.1
                });

                const material = new THREE.MeshPhongMaterial({ color: 0x00ffff, shininess: 80 });
                const mesh = new THREE.Mesh(geometry, material);
                
                // 起始位置排隊
                mesh.position.set(10 + (i * 3), 4, 2);
                scene.add(mesh);
                charMeshes.push(mesh);
            });
        }

        // --- 4. 動畫循環 ---
        function animate() {
            requestAnimationFrame(animate);
            
            charMeshes.forEach((mesh) => {
                if (mesh.position.x > -6) {
                    // 直行
                    mesh.position.x -= 0.08;
                } else {
                    // 轉彎進入 (右轉)
                    if (mesh.rotation.y > -Math.PI / 2) {
                        mesh.rotation.y -= 0.1;
                    }
                    mesh.position.z -= 0.1;
                }

                // 重置
                if (mesh.position.z < -10) {
                    mesh.position.set(15, 4, 2);
                    mesh.rotation.y = 0;
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = () => {
            if (currentFont) createMarquee(document.getElementById('textInput').value);
        };
    </script>
</body>
</html>
