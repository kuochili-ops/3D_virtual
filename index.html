<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Pro - Direct Record</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Long+Cang&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #media-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; z-index: 1; }
        #bg-video, #bg-image { flex-shrink: 0; object-fit: contain; transform-origin: center; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: auto; }
        #app-ui { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); transition: transform 0.3s; border-top: 1px solid #333; }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; font-weight: bold; }
        .ui-content { padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .slider-group { flex: 1; display: flex; flex-direction: column; }
        .slider-label { color: #00ffff; font-size: 10px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: #00ffff; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 10px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; color: #000; }
        .mode-btn { background: #444; color: #ccc; }
        .active-mode { background: #ffaa00 !important; color: #000 !important; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 45%; }
        #rec-btn { width: 48px; height: 48px; border: 3px solid #fff; background: #ff0000; border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.4); }
        #rec-btn.recording { background: #fff; border-radius: 8px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1000; color: #00ffff; justify-content: center; align-items: center; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<div id="loading-overlay"><div>正在處理影片...</div><small>請勿關閉視窗</small></div>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted style="display:none;"></video>
    <img id="bg-image" style="display:none;">
</div>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 收合選單</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="直錄成功">
            <input type="color" id="colorPicker" value="#00ffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff; flex:0.6;">更換字型</button>
        </div>
        <div class="ui-row">
            <div class="slider-group">
                <div class="slider-label"><span>速度</span><span id="speedVal">1.0</span></div>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>字距</span><span id="spacingVal">0.12</span></div>
                <input type="range" id="spacingSlider" min="0.01" max="0.5" step="0.01" value="0.12">
            </div>
        </div>
        <div class="ui-row">
            <button class="btn mode-btn active-mode" id="modePath">📍 3D 路徑</button>
            <button class="btn mode-btn" id="modePhoto">🖼️ 背景調整</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 鏡頭</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 照片</button>
            <button class="btn" id="toggleGuide" style="background:#444; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class ARFullRecorder {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
            this.params = { speed: 1.0, spacing: 0.12, mode: 'path', helpers: true, fontIdx: 0, fontStyles: ['900 400px "Noto Serif TC"', '400 400px "Long Cang"', '400 400px "ZCOOL QingKe HuangYou"', '900 400px "Noto Sans TC"'] };
            this.bgParams = { scale: 1, x: 0, y: 0 };
            
            // 合成錄影專用 Canvas
            this.finalCanvas = document.createElement('canvas');
            this.finalCtx = this.finalCanvas.getContext('2d');
            this.isRecording = false;

            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(1); // 錄影建議設為 1 以維持流暢
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 200, 1000);
            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.grid = new THREE.GridHelper(2000, 25, 0x00ffff, 0x333333);
            this.scene.add(this.grid);

            this.points = [this._createPoint(new THREE.Vector3(300, 50, 0), 0x00ff00), this._createPoint(new THREE.Vector3(0, 300, 200), 0xffff00), this._createPoint(new THREE.Vector3(-300, 50, 0), 0xff0000)];
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            
            this._bindUI();
            this.updateText();
            this._animate();
        }

        _bindUI() {
            const get = (id) => document.getElementById(id);
            get('speedSlider').oninput = (e) => { this.params.speed = parseFloat(e.target.value); get('speedVal').innerText = e.target.value; };
            get('spacingSlider').oninput = (e) => { this.params.spacing = parseFloat(e.target.value); get('spacingVal').innerText = e.target.value; };
            get('modePath').onclick = () => this.setMode('path');
            get('modePhoto').onclick = () => this.setMode('photo');
            get('camBtn').onclick = () => this.startCamera();
            get('openAlbum').onclick = () => get('media-input').click();
            get('media-input').onchange = (e) => this.loadPhoto(e.target.files[0]);
            get('fontToggle').onclick = () => { this.params.fontIdx = (this.params.fontIdx + 1) % 4; this.updateText(); };
            get('toggleUI').onclick = () => get('app-ui').classList.toggle('collapsed');
            get('textInput').oninput = () => this.updateText();
            get('colorPicker').oninput = () => this.updateText();
            get('toggleGuide').onclick = () => this.toggleHelpers(true);
            get('rec-btn').onclick = () => this.startDirectRecording();
            this._setupBGTouch();
        }

        async startDirectRecording() {
            if (this.isRecording) { this.isRecording = false; return; }
            
            this.isRecording = true;
            const btn = document.getElementById('rec-btn');
            const ui = document.getElementById('app-ui');
            btn.classList.add('recording');
            ui.classList.add('collapsed');
            if (this.params.helpers) this.toggleHelpers();

            // 設定合成畫布大小
            this.finalCanvas.width = this.renderer.domElement.width;
            this.finalCanvas.height = this.renderer.domElement.height;

            const stream = this.finalCanvas.captureStream(60);
            this.mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
            this.recordedChunks = [];
            this.mediaRecorder.ondataavailable = e => this.recordedChunks.push(e.data);
            this.mediaRecorder.onstop = () => this._download();
            this.mediaRecorder.start();
        }

        _download() {
            document.getElementById('loading-overlay').style.display = 'flex';
            const blob = new Blob(this.recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `AR_Video_${Date.now()}.webm`;
            a.click();
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('rec-btn').classList.remove('recording');
                document.getElementById('app-ui').classList.remove('collapsed');
                this.toggleHelpers();
            }, 500);
        }

        _animate() {
            requestAnimationFrame(() => this._animate());
            this.orbit.update();
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = Date.now() * 0.0008 * this.params.speed;
            this.charGroups?.forEach((g, i) => {
                let t = (baseTime - i * this.params.spacing) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);

            // 如果正在錄影，執行合成畫布繪製
            if (this.isRecording) {
                this.finalCtx.clearRect(0, 0, this.finalCanvas.width, this.finalCanvas.height);
                // 1. 繪製背景 (相機或圖片)
                if (this.activeEl) {
                    const rect = this.activeEl.getBoundingClientRect();
                    // 考慮縮放與位移
                    this.finalCtx.save();
                    this.finalCtx.translate(this.finalCanvas.width/2 + this.bgParams.x, this.finalCanvas.height/2 + this.bgParams.y);
                    this.finalCtx.scale(this.bgParams.scale, this.bgParams.scale);
                    // 根據 activeEl 是影片或圖片繪製
                    const w = this.activeEl.videoWidth || this.activeEl.naturalWidth;
                    const h = this.activeEl.videoHeight || this.activeEl.naturalHeight;
                    const aspect = w / h;
                    const drawH = this.finalCanvas.height;
                    const drawW = drawH * aspect;
                    this.finalCtx.drawImage(this.activeEl, -drawW/2, -drawH/2, drawW, drawH);
                    this.finalCtx.restore();
                }
                // 2. 疊加 3D 文字層
                this.finalCtx.drawImage(this.renderer.domElement, 0, 0);
            }
        }

        // ... 其餘基礎功能保持 ...
        toggleHelpers(manual = false) { if(manual) this.params.helpers = !this.params.helpers; this.grid.visible = this.params.helpers; this.points.forEach(p => p.visible = this.params.helpers); }
        async updateText() {
            const style = this.params.fontStyles[this.params.fontIdx];
            if (!document.fonts.check(style)) await document.fonts.load(style);
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = style; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 15; ctx.strokeText(c, 256, 256);
                ctx.fillStyle = document.getElementById('colorPicker').value; ctx.fillText(c, 256, 256);
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 20; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(85, 85), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
                    m.position.z = -j * 1.8; m.material.opacity = (1 - j/22);
                    g.add(m);
                }
                this.scene.add(g); this.charGroups.push(g);
            });
        }
        setMode(m) { this.params.mode = m; this.drag.enabled = (m === 'path'); this.orbit.enabled = (m === 'path'); document.getElementById('modePath').classList.toggle('active-mode', m === 'path'); document.getElementById('modePhoto').classList.toggle('active-mode', m === 'photo'); }
        async startCamera() { const v = document.getElementById('bg-video'); const i = document.getElementById('bg-image'); i.style.display = 'none'; v.style.display = 'block'; v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); this.activeEl = v; }
        loadPhoto(file) { const i = document.getElementById('bg-image'); const v = document.getElementById('bg-video'); v.style.display = 'none'; i.style.display = 'block'; i.src = URL.createObjectURL(file); this.activeEl = i; }
        _setupBGTouch() {
            let lx, ly, ld;
            this.renderer.domElement.addEventListener('touchstart', (e) => { if (this.params.mode !== 'photo') return; lx = e.touches[0].clientX; ly = e.touches[0].clientY; if (e.touches.length === 2) ld = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); });
            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (this.params.mode !== 'photo') return;
                if (e.touches.length === 1) { this.bgParams.x += e.touches[0].clientX - lx; this.bgParams.y += e.touches[0].clientY - ly; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
                else if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); this.bgParams.scale *= (d / ld); ld = d; }
                if (this.activeEl) this.activeEl.style.transform = `translate(${this.bgParams.x}px, ${this.bgParams.y}px) scale(${this.bgParams.scale})`;
            });
        }
        _createPoint(pos, color) { const m = new THREE.Mesh(new THREE.SphereGeometry(35), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })); m.position.copy(pos); this.scene.add(m); return m; }
    }
    window.onload = () => new ARFullRecorder();
</script>
</body>
</html>
