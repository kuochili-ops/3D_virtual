<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FlipBoardAR - UI Restore</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Long+Cang&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; height: 100vh; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        #media-layer { position: absolute; visibility: hidden; pointer-events: none; }
        
        /* 友善介面設計 */
        #app-ui { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom); }
        #app-ui.collapsed { transform: translateY(calc(100% - 45px)); }
        
        .tab-handle { height: 45px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; font-weight: bold; letter-spacing: 2px; }
        .ui-content { padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .ui-row { width: 90%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        .btn { flex: 1; height: 45px; background: #333; border: 1px solid #555; border-radius: 10px; color: #fff; font-weight: bold; font-size: 13px; display: flex; justify-content: center; align-items: center; }
        .btn-active { background: #00ffff !important; color: #000 !important; border-color: #fff !important; }
        .btn-rec { width: 55px; height: 55px; background: #ff0000; border: 4px solid #fff; border-radius: 50%; }
        
        input[type="text"] { background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; flex: 1.5; font-size: 16px; }
        
        #stop-rec-overlay { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 500; background: #ff0000; color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="stop-rec-overlay">⏹ 停止錄製並儲存</div>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted></video>
    <img id="bg-image">
</div>

<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">一一一 MENU 一一一</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="HELLO AR">
            <input type="color" id="colorPicker" value="#00ffff" style="width:45px; height:45px; border:none; padding:0;">
            <button class="btn" id="fontToggle" style="flex:0.6">字型</button>
        </div>
        <div class="ui-row">
            <button class="btn btn-active" id="modePath">📍 調整路徑</button>
            <button class="btn" id="modePhoto">🖼️ 調整背景</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 開相機</button>
            <button class="btn" id="openAlbum">📂 選照片</button>
            <button class="btn" id="toggleGuide" style="flex:0.3">👁️</button>
            <div class="btn-rec" id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class ARFriendlyFix {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 5000);
            this.displayCanvas = document.createElement('canvas');
            this.ctx = this.displayCanvas.getContext('2d');
            
            this.params = { speed: 1.0, spacing: 0.15, mode: 'path', helpers: true, fontIdx: 0, fontStyles: ['900 400px "Noto Serif TC"', '400 400px "Long Cang"', '400 400px "ZCOOL QingKe HuangYou"', '900 400px "Noto Sans TC"'] };
            this.bgParams = { scale: 1, x: 0, y: 0 };
            this.activeMedia = null;
            
            this.init();
        }

        init() {
            this._resize();
            window.addEventListener('resize', () => this._resize());
            document.getElementById('canvas-container').appendChild(this.displayCanvas);

            // 🛠️ 更加友善的視角：稍微俯視，讓網格有立體感
            this.camera.position.set(0, 300, 1200);
            this.camera.lookAt(0, 0, 0);

            this.orbit = new OrbitControls(this.camera, this.displayCanvas);
            this.orbit.enableDamping = true;
            
            // 網格放在腳下
            this.grid = new THREE.GridHelper(2000, 20, 0x00ffff, 0x333333);
            this.scene.add(this.grid);
            
            // 🛠️ 確保球在畫面上方，好點選
            this.points = [
                this._createPoint(new THREE.Vector3(-400, 100, 0), 0x00ff00),
                this._createPoint(new THREE.Vector3(0, 500, 0), 0xffff00),
                this._createPoint(new THREE.Vector3(400, 100, 0), 0xff0000)
            ];
            
            this.drag = new DragControls([...this.points], this.camera, this.displayCanvas);
            // 🛠️ 重要：解決與 OrbitControls 的衝突
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => this.orbit.enabled = true);

            this._bindUI();
            this.updateText();
            this._renderLoop();
        }

        _resize() {
            const pr = window.devicePixelRatio || 1;
            this.displayCanvas.width = window.innerWidth * pr;
            this.displayCanvas.height = window.innerHeight * pr;
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
        }

        _bindUI() {
            const get = (id) => document.getElementById(id);
            get('camBtn').onclick = () => this.startCamera();
            get('openAlbum').onclick = () => get('media-input').click();
            get('media-input').onchange = (e) => {
                const i = document.getElementById('bg-image');
                i.src = URL.createObjectURL(e.target.files[0]);
                i.onload = () => { this.activeMedia = i; this.bgParams = {scale:1, x:0, y:0}; };
            };
            get('modePath').onclick = () => this.switchMode('path');
            get('modePhoto').onclick = () => this.switchMode('photo');
            get('toggleGuide').onclick = () => this.toggleHelpers();
            get('rec-btn').onclick = () => this.startRecording();
            get('stop-rec-overlay').onclick = () => this.stopRecording();
            get('toggleUI').onclick = () => get('app-ui').classList.toggle('collapsed');
            get('fontToggle').onclick = () => { this.params.fontIdx = (this.params.fontIdx+1)%4; this.updateText(); };
            get('textInput').oninput = () => this.updateText();
            get('colorPicker').oninput = () => this.updateText();
            this._setupBGTouch();
        }

        switchMode(m) {
            this.params.mode = m;
            document.getElementById('modePath').classList.toggle('btn-active', m==='path');
            document.getElementById('modePhoto').classList.toggle('btn-active', m==='photo');
            this.drag.enabled = (m === 'path');
            this.orbit.enabled = (m === 'path');
        }

        toggleHelpers() {
            this.params.helpers = !this.params.helpers;
            this.grid.visible = this.params.helpers;
            this.points.forEach(p => p.visible = this.params.helpers);
        }

        async startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const v = document.getElementById('bg-video');
            v.srcObject = stream;
            v.onloadedmetadata = () => { v.play(); this.activeMedia = v; };
        }

        _renderLoop() {
            requestAnimationFrame(() => this._renderLoop());
            this.orbit.update();
            this._animateText();
            this.renderer.render(this.scene, this.camera);

            const cw = this.displayCanvas.width;
            const ch = this.displayCanvas.height;
            this.ctx.clearRect(0,0,cw,ch);
            
            if (this.activeMedia) {
                const mw = this.activeMedia.videoWidth || this.activeMedia.naturalWidth;
                const mh = this.activeMedia.videoHeight || this.activeMedia.naturalHeight;
                const scale = Math.max(cw / mw, ch / mh) * this.bgParams.scale;
                const x = (cw - mw * scale) / 2 + (this.bgParams.x * window.devicePixelRatio);
                const y = (ch - mh * scale) / 2 + (this.bgParams.y * window.devicePixelRatio);
                this.ctx.drawImage(this.activeMedia, x, y, mw * scale, mh * scale);
            }
            this.ctx.drawImage(this.renderer.domElement, 0, 0, cw, ch);
        }

        // 錄影邏輯保持穩定
        startRecording() {
            document.getElementById('stop-rec-overlay').style.display = 'block';
            document.getElementById('app-ui').classList.add('collapsed');
            const stream = this.displayCanvas.captureStream(30);
            this.mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            this.chunks = [];
            this.mediaRecorder.ondataavailable = e => this.chunks.push(e.data);
            this.mediaRecorder.onstop = () => {
                const blob = new Blob(this.chunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'AR_Works.webm'; a.click();
            };
            this.mediaRecorder.start();
        }
        stopRecording() {
            this.mediaRecorder.stop();
            document.getElementById('stop-rec-overlay').style.display = 'none';
        }

        _setupBGTouch() {
            let lx, ly, ld;
            this.displayCanvas.addEventListener('touchstart', (e) => {
                if (this.params.mode !== 'photo') return;
                lx = e.touches[0].clientX; ly = e.touches[0].clientY;
                if (e.touches.length === 2) ld = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            });
            this.displayCanvas.addEventListener('touchmove', (e) => {
                if (this.params.mode !== 'photo') return;
                if (e.touches.length === 1) { 
                    this.bgParams.x += e.touches[0].clientX - lx; 
                    this.bgParams.y += e.touches[0].clientY - ly; 
                    lx = e.touches[0].clientX; ly = e.touches[0].clientY; 
                } else if (e.touches.length === 2) {
                    const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    this.bgParams.scale *= (d / ld); ld = d;
                }
            });
        }
        _createPoint(pos, color) { const m = new THREE.Mesh(new THREE.SphereGeometry(40), new THREE.MeshBasicMaterial({ color })); m.position.copy(pos); this.scene.add(m); return m; }
        async updateText() {
            const style = this.params.fontStyles[this.params.fontIdx];
            if (!document.fonts.check(style)) await document.fonts.load(style);
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = style; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = document.getElementById('colorPicker').value; ctx.fillText(c, 256, 256);
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 12; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                    m.position.z = -j * 2.5; g.add(m);
                }
                this.scene.add(g); this.charGroups.push(g);
            });
        }
        _animateText() {
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = Date.now() * 0.0008;
            this.charGroups?.forEach((g, i) => {
                let t = (baseTime - i * this.params.spacing) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) { const pos = curve.getPointAt(t); g.position.copy(pos); g.lookAt(pos.clone().add(curve.getTangentAt(t))); g.rotateY(Math.PI / 2); g.visible = true; } else g.visible = false;
            });
        }
    }
    window.onload = () => new ARFriendlyFix();
</script>
</body>
</html>
