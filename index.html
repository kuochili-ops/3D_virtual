<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercedes-Benz 3D Showcase</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #app-ui {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            display: flex; gap: 8px; width: 260px;
        }
        input { flex: 1; padding: 8px; border-radius: 6px; border: none; background: rgba(0,0,0,0.6); color: #fff; }
        button { padding: 8px 15px; border-radius: 6px; border: none; background: #e0e0e0; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-ui">
    <input type="text" id="textInput" value="Mercedes-Benz SUV">
    <button id="updateBtn">更新</button>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class MercedesShowcase {
        constructor() {
            this.config = { speed: 0.08, depth: 50, fontSize: 320, color: "#e0e0e0" }; // 銀色系
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // 初始視角：模仿新宿 3D 拍攝的角度
            this.camera.position.set(70, 35, 80); 
            this.controls = new OrbitControls(this.camera, this.renderer.domElement);
            this.controls.enableDamping = true;

            // 光源：模擬展間的高級光
            const light = new THREE.DirectionalLight(0xffffff, 5);
            light.position.set(10, 20, 10);
            this.scene.add(light);
            this.scene.add(new THREE.AmbientLight(0xffffff, 3));

            // --- 賓士休旅車占位塊 ---
            const carGeo = new THREE.BoxGeometry(20, 10, 35);
            const carMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.1 });
            const car = new THREE.Mesh(carGeo, carMat);
            car.position.set(-5, 0, -10);
            this.scene.add(car);

            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(10, 10);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    // 強化銀色漸層
                    const shade = (0.2 + 0.8 * Math.pow(1 - j/this.config.depth, 1.5));
                    color.multiplyScalar(shade);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.18, side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.1); 
                    group.add(m);
                }

                const spacing = 12;
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', 
                    xStart: 80 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 8, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.controls.update();

            const R = 28; // 加大轉彎半徑，繞過車頭
            const cornerX = 5; 

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s; 
                    if (g.position.x <= cornerX) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    g.userData.angle += (s / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall';
                    }
                } else {
                    g.position.z -= (s * 1.5); // 左方無遮蔽，文字加速沒入深處
                }

                if (g.position.z < -150) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    const maxCharX = Math.max(...this.charGroups.map(ch => ch.position.x), 70);
                    g.position.set(maxCharX + 12, 8, 0);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new MercedesShowcase();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
