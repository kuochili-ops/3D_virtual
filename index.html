<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Module Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        
        /* 影像層：確保背景比例正確且不偏暗 */
        #media-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; overflow: hidden; z-index: 1;
        }
        #bg-image, #bg-video {
            flex-shrink: 0; object-fit: contain; transform-origin: center;
        }

        /* 3D 層：透明渲染 */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: auto; }

        /* UI 層 */
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); transition: transform 0.3s;
        }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; }
        .ui-content { padding: 10px 0 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .mode-btn { background: #444; color: #ccc; }
        .active-mode { background: #ffaa00 !important; color: #000 !important; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 35%; }
        #rec-btn { width: 45px; height: 45px; border: 3px solid #fff; background: red; border-radius: 50%; }
    </style>
</head>
<body>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted style="display:none;"></video>
    <img id="bg-image" style="display:none;">
</div>

<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 設定</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES">
            <input type="color" id="colorPicker" value="#ffffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff;">字型</button>
        </div>
        <div class="ui-row">
            <button class="btn mode-btn active-mode" id="modePath">📍 調整路徑</button>
            <button class="btn mode-btn" id="modePhoto">🖼️ 調整照片</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 啟動相機</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 導入照片</button>
            <button class="btn" id="toggleGuide" style="background:#666; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARAppModule {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            
            this.bgParams = { scale: 1, x: 0, y: 0 };
            this.controlMode = 'path'; 
            this.fontIdx = 0;
            this.fontStyles = ['900 400px "Noto Serif TC"', '400 400px "Zhi Mang Xing"', '400 400px "Ma Shan Zheng"', '900 400px sans-serif'];

            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.z = 1000;

            // 輔助網格
            this.grid = new THREE.GridHelper(1500, 20, 0x00ffff, 0x444444);
            this.grid.position.y = -200;
            this.scene.add(this.grid);

            // 定位球
            this.points = [
                this.createPoint(new THREE.Vector3(300, 0, 0), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 300, 100), 0xffff00),
                this.createPoint(new THREE.Vector3(-300, 0, 0), 0xff0000)
            ];

            this.dragControls = new DragControls([...this.points], this.camera, this.renderer.domElement);
            
            // 模式切換邏輯
            document.getElementById('modePath').onclick = () => this.setMode('path');
            document.getElementById('modePhoto').onclick = () => this.setMode('photo');
            document.getElementById('camBtn').onclick = () => this.startCamera();
            document.getElementById('openAlbum').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.loadPhoto(e.target.files[0]);
            document.getElementById('toggleGuide').onclick = () => { this.grid.visible = !this.grid.visible; this.points.forEach(p => p.visible = this.grid.visible); };
            document.getElementById('fontToggle').onclick = () => { this.fontIdx = (this.fontIdx + 1) % 4; this.updateText(); };
            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('colorPicker').oninput = () => this.updateText();
            document.getElementById('toggleUI').onclick = () => document.getElementById('app-ui').classList.toggle('collapsed');

            this.setupTouch();
            this.updateText();
            this.animate();
        }

        setMode(m) {
            this.controlMode = m;
            document.getElementById('modePath').classList.toggle('active-mode', m === 'path');
            document.getElementById('modePhoto').classList.toggle('active-mode', m === 'photo');
            this.dragControls.enabled = (m === 'path');
        }

        async startCamera() {
            const video = document.getElementById('bg-video');
            const img = document.getElementById('bg-image');
            img.style.display = 'none';
            video.style.display = 'block';
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            this.activeElement = video;
            this.resetBG();
        }

        loadPhoto(file) {
            const video = document.getElementById('bg-video');
            const img = document.getElementById('bg-image');
            video.style.display = 'none';
            img.style.display = 'block';
            
            img.src = URL.createObjectURL(file);
            this.activeElement = img;
            this.resetBG();
        }

        resetBG() {
            this.bgParams = { scale: 1, x: 0, y: 0 };
            this.updateBGTransform();
        }

        updateBGTransform() {
            if (!this.activeElement) return;
            this.activeElement.style.transform = `translate(${this.bgParams.x}px, ${this.bgParams.y}px) scale(${this.bgParams.scale})`;
        }

        setupTouch() {
            let lastX, lastY, lastDist;
            const container = document.getElementById('canvas-container');

            container.addEventListener('touchstart', (e) => {
                if (this.controlMode === 'photo') {
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                    if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                }
            });

            container.addEventListener('touchmove', (e) => {
                if (this.controlMode !== 'photo') return;
                e.preventDefault();
                if (e.touches.length === 1) {
                    this.bgParams.x += e.touches[0].clientX - lastX;
                    this.bgParams.y += e.touches[0].clientY - lastY;
                    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    this.bgParams.scale *= (dist / lastDist);
                    lastDist = dist;
                }
                this.updateBGTransform();
            }, { passive: false });
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(25), new THREE.MeshBasicMaterial({ color }));
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        async updateText() {
            await document.fonts.ready;
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = this.fontStyles[this.fontIdx];
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 20;
                ctx.strokeText(c, 256, 256);
                ctx.fillStyle = document.getElementById('colorPicker').value;
                ctx.fillText(c, 256, 256);
                
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 18; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                    m.position.z = -j * 2;
                    m.material.opacity = (1 - j/18);
                    g.add(m);
                }
                g.userData.tOffset = -i * 0.12;
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups?.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    window.onload = () => new ARAppModule();
</script>
</body>
</html>
