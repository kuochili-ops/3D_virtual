<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercedes AR - Head First Mode</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #video-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: auto; }
        
        #app-ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 1px solid #00ffff;
            display: flex; flex-direction: column; gap: 10px; width: 220px;
        }
        .ui-row { display: flex; flex-direction: column; gap: 4px; }
        label { color: #00ffff; font-size: 11px; font-weight: bold; }
        input, button { padding: 10px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; }
        #speedSlider { accent-color: #00ffff; }
        
        #rec-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff;
            background: red; z-index: 1000; cursor: pointer;
        }
        #rec-btn.active { background: #fff; border-color: red; border-radius: 15px; }
    </style>
</head>
<body>

<video id="video-bg" autoplay playsinline></video>
<div id="three-canvas"></div>

<div id="app-ui">
    <div class="ui-row">
        <label>文字內容</label>
        <input type="text" id="textInput" value="MERCEDES-BENZ">
    </div>
    <div class="ui-row">
        <label>慢速調整</label>
        <input type="range" id="speedSlider" min="1" max="50" value="5">
    </div>
    <button id="startCam" style="background: #00ffff; color: #000;">1. 開啟相機</button>
    <button id="toggleGuide" style="background: #444; color: #fff;">隱藏/顯示輔助球</button>
    <button id="toggleDir" style="background: #444; color: #fff;">切換出發端 (頭朝前)</button>
</div>

<div id="rec-btn" id="recordBtn"></div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class HeadFirstAR {
        constructor() {
            this.config = { speed: 0.0005, reverse: false, showGuides: true };
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.charGroups = [];
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-canvas').appendChild(this.renderer.domElement);
            
            // 視角優化：確保手機打開時字在正前方
            this.camera.position.set(0, 20, 150);
            this.scene.add(new THREE.AmbientLight(0xffffff, 5));

            // 設定路徑點 (調整 X, Z 使其更容易在相機前看到)
            this.points = [
                this.createPoint(new THREE.Vector3(60, 0, -20)),
                this.createPoint(new THREE.Vector3(0, 0, 0)),
                this.createPoint(new THREE.Vector3(-60, 0, -20))
            ];

            const drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            drag.addEventListener('drag', () => this.updatePath());

            // UI 控制
            document.getElementById('startCam').onclick = async () => {
                const video = document.getElementById('video-bg');
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = s;
            };

            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('speedSlider').oninput = (e) => this.config.speed = e.target.value * 0.0001;
            document.getElementById('toggleDir').onclick = () => this.config.reverse = !this.config.reverse;
            document.getElementById('toggleGuide').onclick = () => {
                this.config.showGuides = !this.config.showGuides;
                this.points.forEach(p => p.visible = this.config.showGuides);
            };

            this.updatePath();
            this.updateText();
            this.animate();
        }

        createPoint(pos) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 }));
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        updatePath() {
            this.curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = new THREE.Group();
                const tex = this.createTexture(c);
                for (let j = 0; j < 40; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.2, side: THREE.DoubleSide }));
                    m.position.z = -j * 0.15;
                    m.material.color.setScalar(0.3 + 0.7 * (1 - j/40));
                    g.add(m);
                }
                g.userData.tOffset = i * 0.15; // 文字間距
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createTexture(char) {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.font = 'bold 380px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const time = Date.now() * this.config.speed;
            
            this.charGroups.forEach(g => {
                let rawT = (time + g.userData.tOffset) % 1.8;
                // 修正邏輯：切換方向時，文字頭部始終朝向切線方向
                let t = this.config.reverse ? (rawT - 0.4) : (1.4 - rawT);

                if (t >= 0 && t <= 1) {
                    const pos = this.curve.getPointAt(t);
                    const tangent = this.curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    
                    // 根據當前進度 t 的變化方向來決定 lookAt
                    const lookTarget = pos.clone().add(this.config.reverse ? tangent : tangent.multiplyScalar(-1));
                    g.lookAt(lookTarget);
                    
                    // 修正 90 度偏差使 X 軸貼合
                    g.rotateY(Math.PI / 2); 
                    
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    new HeadFirstAR();
</script>
</body>
</html>
