<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Studio - Pro Full 3D</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.8); padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .label { color: #00ffff; font-size: 11px; white-space: nowrap; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 4px; width: 50%; font-size: 14px; }
        input[type="color"] { border: none; width: 35px; height: 35px; background: none; cursor: pointer; }
        .btn { background: #00ffff; border: none; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 11px; flex: 1; }
        #rec-btn { width: 50px; height: 50px; border: 3px solid #fff; background: red; border-radius: 50%; }
        #rec-btn.recording { border-radius: 10px; background: #fff; transform: scale(0.8); }
        .hint { color: #fff; font-size: 10px; opacity: 0.6; margin-bottom: 2px; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted style="display:none;"></video>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="hint">💡 選中球：單指移位置，雙指捏合控遠近</div>
    <div class="ui-row">
        <input type="text" id="textInput" value="MERCEDES-BENZ">
        <input type="color" id="colorPicker" value="#ffffff">
        <button class="btn" id="updateBtn">更新文字</button>
    </div>
    
    <div class="ui-row">
        <span class="label">流速</span>
        <input type="range" id="speedSlider" min="1" max="100" value="20" style="width: 100%; accent-color: #00ffff;">
    </div>

    <div class="ui-row">
        <button class="btn" id="startCam" style="background:#fff;">📸 開啟相機/實景微調</button>
        <button class="btn" id="toggleGuide" style="background:#444; color:#fff;">隱藏球</button>
        <div id="rec-btn"></div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ProFull3DAR {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.charColor = new THREE.Color(0xffffff);
            this.flowSpeed = 0.001;
            this.selectedPoint = null;
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            
            // 預設視角
            this.camera.position.set(0, 100, 450);

            // 輔助網格
            this.grid = new THREE.GridHelper(600, 25, 0x00ffff, 0x222222);
            this.grid.position.y = -80;
            this.scene.add(this.grid);

            // 建立 3D 控制點 (初始帶有深度)
            this.points = [
                this.createPoint(new THREE.Vector3(120, 0, -50), 0x00ff00), // 起 (綠)
                this.createPoint(new THREE.Vector3(0, 80, 100), 0xffff00),  // 彎 (黃)
                this.createPoint(new THREE.Vector3(-120, 0, -50), 0xff0000) // 終 (紅)
            ];

            // 視角旋轉 (雙指在空白處)
            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_PAN };

            // 拖拽控制 (單指在球上)
            this.drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            this.drag.addEventListener('hoveron', (e) => { 
                this.selectedPoint = e.object; 
                this.orbit.enabled = false; 
                e.object.material.opacity = 1;
            });
            this.drag.addEventListener('hoveroff', () => { 
                this.orbit.enabled = true; 
            });

            // UI 綁定
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('colorPicker').oninput = (e) => {
                this.charColor.set(e.target.value);
                this.updateText();
            };
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00005;
            document.getElementById('startCam').onclick = () => this.startAR();
            document.getElementById('toggleGuide').onclick = (e) => {
                const visible = !this.points[0].visible;
                this.points.forEach(p => p.visible = visible);
                e.target.innerText = visible ? "隱藏球" : "顯示球";
            };
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecord(e.target);

            this.initPinchZ(); // 重新載入雙指控深度功能
            this.updateText();
            this.animate();
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(15), 
                new THREE.MeshBasicMaterial({ color: color, depthTest: false, transparent: true, opacity: 0.8 })
            );
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        // 核心功能：雙指捏合控深度 (Z 軸)
        initPinchZ() {
            let initialDist = 0;
            let initialZ = 0;
            this.renderer.domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2 && this.selectedPoint) {
                    initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    initialZ = this.selectedPoint.position.z;
                }
            });

            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && this.selectedPoint) {
                    const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    const delta = (currentDist - initialDist) * 1.5; // 靈敏度
                    this.selectedPoint.position.z = initialZ + delta;
                }
            }, { passive: false });
        }

        async startAR() {
            const v = document.getElementById('video-source');
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                v.srcObject = s; v.play();
                this.scene.background = new THREE.VideoTexture(v);
                this.grid.visible = false;
                this.camera.position.set(0, 0, 450); // 切換至實景正視角
                this.orbit.enabled = false; // 進入實景後固定視角，僅保留拖拽
            } catch (e) { alert("相機啟動失敗"); }
        }

        updateText() {
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * 0.25; 
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 25; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), new THREE.MeshBasicMaterial({ 
                    map: tex, transparent: true, alphaTest: 0.1, color: this.charColor 
                }));
                m.position.z = -j * 0.5;
                m.material.opacity = (1 - j/25);
                g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * this.flowSpeed;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    const tan = curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tan));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                const stream = this.renderer.domElement.captureStream(30);
                this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = 'ar_3d_pro.webm'; a.click();
                };
                this.recorder.start();
                btn.classList.add('recording');
            } else {
                this.recorder.stop();
                btn.classList.remove('recording');
            }
        }
    }
    new ProFull3DAR();
</script>
</body>
</html>
