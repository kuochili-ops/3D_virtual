<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 慢速轉彎前進看板</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px; color: white;
            border: 1px solid #444;
        }
        button { padding: 8px 12px; background: #00ffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui">
        <input type="text" id="textInput" value="基隆市府安排免費接駁車" style="padding:8px; width:220px;">
        <button id="updateBtn">更新畫面</button>
        <div style="font-size: 11px; color: #888; margin-top: 5px;">狀態：極慢速轉彎模式 (1/3 速度)</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 視角優化：從側面斜後方觀看，能看清轉彎前後的所有路徑
        camera.position.set(30, 20, 40);
        camera.lookAt(-10, 5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 2.0));
        
        // 地面網格延伸，作為移動參考
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(grid);

        // 密集堆疊字 (實作您的密集線連線概念)
        function createStackedChar(char) {
            const group = new THREE.Group();
            const layers = 35;
            const depthStep = 0.05;
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 180px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            for (let i = 0; i < layers; i++) {
                ctx.clearRect(0, 0, 256, 256);
                ctx.fillStyle = i === 0 ? '#00ffff' : `rgb(0, ${150-i*4}, ${200-i*5})`;
                ctx.fillText(char, 128, 128);
                const texture = new THREE.CanvasTexture(canvas);
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshBasicMaterial({ map: texture, transparent: true }));
                plane.position.z = -(i * depthStep);
                group.add(plane);
            }
            return group;
        }

        let charGroups = [];
        // 設定極慢速度：0.03 (原先為 0.12)
        const config = { speed: 0.03, turnX: -5, finishZ: -50, spacing: 4.5 };

        function start() {
            charGroups.forEach(g => scene.remove(g));
            charGroups = [];
            const text = document.getElementById('textInput').value;
            text.split('').forEach((c, i) => {
                const g = createStackedChar(c);
                g.position.set(25 + (i * config.spacing), 5, 5);
                scene.add(g);
                charGroups.push(g);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            charGroups.forEach((group) => {
                if (group.position.x > config.turnX) {
                    // 階段 1：慢速平移
                    group.position.x -= config.speed;
                } else {
                    // 階段 2：慢速轉彎與繼續前進
                    
                    // 1. 旋轉變慢 (0.02)
                    if (group.rotation.y > -Math.PI / 2) {
                        group.rotation.y -= 0.02; 
                    }
                    
                    // 2. 轉向後繼續沿著 Z 軸前進
                    group.position.z -= config.speed * 2.5; 
                    
                    // 3. 微調 X 形成弧度，而不是死板的 90 度折角
                    if (group.rotation.y > -Math.PI / 2) {
                        group.position.x -= 0.015;
                    }
                }

                // 走到很遠才重置
                if (group.position.z < config.finishZ) {
                    const lastX = Math.max(...charGroups.map(g => g.position.x));
                    group.position.set(lastX + config.spacing, 5, 5);
                    group.rotation.y = 0;
                }
            });
            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = start;
        start(); animate();
    </script>
</body>
</html>
