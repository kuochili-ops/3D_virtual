<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR - Vision Pro</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* 隱藏視訊元件，僅供程式抓取畫面 */
        #video-source { display: none; }
        
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 14px 5px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; color: #000; }
        .media-btn { background: #fff; color: #000; }
        .view-btn { background: #444; color: #fff; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 12px; border-radius: 8px; width: 50%; font-size: 14px; }
        #rec-btn { width: 55px; height: 55px; border: 4px solid #fff; background: red; border-radius: 50%; }
        #rec-btn.recording { border-radius: 12px; background: #fff; }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted loop webkit-playsinline></video>
<input type="file" id="media-input" accept="image/*,video/*">

<div id="canvas-container"></div>

<div id="app-ui">
    <div class="ui-row">
        <input type="text" id="textInput" value="MERCEDES-BENZ">
        <input type="color" id="colorPicker" value="#ffffff" style="width:35px; height:35px; border:none; background:none;">
        <button class="btn" id="updateBtn">更新</button>
    </div>
    
    <div class="ui-row">
        <span style="color:#00ffff; font-size:11px;">流速</span>
        <input type="range" id="speedSlider" min="1" max="100" value="20" style="width: 40%;">
        <span style="color:#00ffff; font-size:11px;">字距</span>
        <input type="range" id="gapSlider" min="15" max="85" value="35" style="width: 40%;">
    </div>

    <div class="ui-row">
        <button class="btn view-btn" id="viewToggle">🔄 視角切換</button>
        <button class="btn media-btn" id="openMedia">📂 選擇媒體 (相機/相簿)</button>
        <button class="btn" id="toggleGuide" style="background:#666; color:#fff; flex:0.4;">👁️</button>
        <div id="rec-btn"></div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARVisionApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.charColor = new THREE.Color(0xffffff);
            this.flowSpeed = 0.0008;
            this.currentView = "front";
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            this.renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 80, 500); // 稍微調高位置

            this.grid = new THREE.GridHelper(800, 20, 0x00ffff, 0x333333);
            this.grid.position.y = -50;
            this.scene.add(this.grid);

            // 初始化路徑點
            this.points = [
                this.createPoint(new THREE.Vector3(200, 50, -150), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 150, 100), 0xffff00),
                this.createPoint(new THREE.Vector3(-200, 50, -150), 0xff0000)
            ];

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('hoveron', (e) => { this.selectedObj = e.object; this.orbit.enabled = false; });
            this.drag.addEventListener('hoveroff', () => this.orbit.enabled = true);

            document.getElementById('openMedia').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.handleMedia(e.target.files[0]);
            
            document.getElementById('viewToggle').onclick = () => {
                if (this.currentView === "front") {
                    this.camera.position.set(600, 50, 0);
                    this.camera.lookAt(0, 50, 0);
                    this.currentView = "side";
                } else {
                    this.camera.position.set(0, 80, 500);
                    this.camera.lookAt(0, 50, 0);
                    this.currentView = "front";
                }
            };

            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('colorPicker').oninput = (e) => { this.charColor.set(e.target.value); this.updateText(); };
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00004;
            document.getElementById('gapSlider').oninput = (e) => { this.charGap = e.target.value / 100; this.updateText(); };
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecord(e.target);

            this.updateText();
            this.animate();
        }

        handleMedia(file) {
            if (!file) return;
            const url = URL.createObjectURL(file);
            const video = document.getElementById('video-source');
            
            if (file.type.startsWith('image/')) {
                new THREE.TextureLoader().load(url, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    this.scene.background = tex;
                    video.pause();
                });
            } else {
                video.src = url;
                video.load(); // 確保重新載入
                video.play();
                const tex = new THREE.VideoTexture(video);
                tex.colorSpace = THREE.SRGBColorSpace;
                this.scene.background = tex;
            }
            // 點選後自動隱藏輔助，進入拍攝感
            this.toggleHelpers(false);
            this.camera.position.set(0, 80, 500);
            this.currentView = "front";
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(15), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.8 }));
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        updateText() {
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * (this.charGap || 0.35);
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 14; ctx.strokeText(char, 256, 256);
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 12; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1, color: this.charColor }));
                m.position.z = -j * 1.5;
                m.material.opacity = (1 - j/12);
                g.add(m);
            }
            return g;
        }

        toggleHelpers(forceState) {
            const s = forceState !== undefined ? forceState : !this.points[0].visible;
            this.points.forEach(p => p.visible = s);
            this.grid.visible = s;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * this.flowSpeed;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            const isRec = this.recorder && this.recorder.state === "recording";
            if (isRec) this.toggleHelpers(false);
            this.renderer.render(this.scene, this.camera);
            if (isRec) this.toggleHelpers(true);
        }

        toggleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                this.recorder = new MediaRecorder(this.renderer.domElement.captureStream(30), { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `AR_Result.webm`; a.click();
                };
                this.recorder.start();
                btn.classList.add('recording');
            } else { this.recorder.stop(); btn.classList.remove('recording'); }
        }
    }
    new ARVisionApp();
</script>
</body>
</html>
