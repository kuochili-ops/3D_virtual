<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #video-preview { position: absolute; width: 1px; height: 1px; opacity: 0; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            transition: transform 0.3s; padding-bottom: env(safe-area-inset-bottom);
        }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; font-size: 13px; cursor: pointer; }
        .ui-content { padding: 10px 0 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; color: #000; }
        .mode-btn { background: #555; color: #fff; }
        .active-mode { background: #ffaa00 !important; color: #000 !important; font-weight: 900; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 35%; }
        #rec-btn { width: 45px; height: 45px; border: 3px solid #fff; background: red; border-radius: 50%; }
        input[type="file"] { display: none; }
        span { color: #00ffff; font-size: 10px; }
    </style>
</head>
<body>

<video id="video-preview" autoplay playsinline muted></video>
<input type="file" id="media-input" accept="image/*">
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 展開面板</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES">
            <input type="color" id="colorPicker" value="#ffffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff;">🔠 切換字型</button>
        </div>
        <div class="ui-row">
            <button class="btn mode-btn active-mode" id="modePath">📍 路徑調整</button>
            <button class="btn mode-btn" id="modePhoto">🖼️ 照片調整</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn" style="background:#00ffff;">📷 啟動相機</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 讀取照片</button>
            <button class="btn" id="toggleGuide" style="background:#666; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
        <div class="ui-row">
            <span>流速</span>
            <input type="range" id="speedSlider" min="1" max="100" value="20" style="width: 35%;">
            <span>字距</span>
            <input type="range" id="gapSlider" min="1" max="50" value="12" style="width: 35%;">
        </div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARFullApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.renderer.outputColorSpace = THREE.SRGBColorSpace;
            
            this.fontStyles = ['900 400px "Noto Serif TC"', '400 400px "Zhi Mang Xing"', '400 400px "Ma Shan Zheng"', '900 400px sans-serif'];
            this.fontIdx = 0;
            this.controlMode = 'path'; 
            this.helperVisible = true;
            
            // 背景變換參數
            this.bgParams = { scale: 1, pos: new THREE.Vector2(0, 0), rotation: 0 };
            this.bgTexture = null;
            this.facing = "environment";
            this.stream = null;

            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 0, 500);

            this.grid = new THREE.GridHelper(600, 20, 0x00ffff, 0x333333);
            this.grid.position.y = -80;
            this.scene.add(this.grid);

            this.points = [
                this.createPoint(new THREE.Vector3(150, 0, 0), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 150, 50), 0xffff00),
                this.createPoint(new THREE.Vector3(-150, 0, 0), 0xff0000)
            ];

            this.dragControls = new DragControls([...this.points], this.camera, this.renderer.domElement);
            
            // 模式切換
            document.getElementById('modePath').onclick = () => this.setMode('path');
            document.getElementById('modePhoto').onclick = () => this.setMode('photo');
            
            // 相機與照片
            document.getElementById('camBtn').onclick = () => this.toggleCamera();
            document.getElementById('openAlbum').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.handleFile(e.target.files[0]);
            
            // 輔助與顯示
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();
            document.getElementById('fontToggle').onclick = () => { this.fontIdx = (this.fontIdx + 1) % this.fontStyles.length; this.updateText(); };
            document.getElementById('toggleUI').onclick = () => document.getElementById('app-ui').classList.toggle('collapsed');
            
            // 內容同步
            const refresh = () => this.updateText();
            document.getElementById('textInput').oninput = refresh;
            document.getElementById('colorPicker').oninput = refresh;
            document.getElementById('gapSlider').oninput = (e) => { this.charGap = e.target.value / 100; refresh(); };
            this.flowSpeed = 0.0008;
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00004;

            this.charGap = 0.12;
            this.setupGestures();
            this.updateText();
            this.animate();
        }

        setMode(m) {
            this.controlMode = m;
            document.getElementById('modePath').classList.toggle('active-mode', m === 'path');
            document.getElementById('modePhoto').classList.toggle('active-mode', m === 'photo');
            this.dragControls.enabled = (m === 'path');
            // 模式切換時輔助球的邏輯
            this.points.forEach(p => p.visible = (m === 'path' && this.helperVisible));
        }

        async toggleCamera() {
            if (this.stream) {
                this.facing = (this.facing === "environment") ? "user" : "environment";
                this.stream.getTracks().forEach(t => t.stop());
            }
            try {
                this.stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: this.facing, width: {ideal: 1920}, height: {ideal: 1080} }
                });
                const video = document.getElementById('video-preview');
                video.srcObject = this.stream;
                video.onloadedmetadata = () => {
                    this.bgTexture = new THREE.VideoTexture(video);
                    this.bgTexture.colorSpace = THREE.SRGBColorSpace;
                    this.updateBackground();
                    this.toggleHelpers(false);
                };
            } catch (err) { alert("無法啟動相機，請檢查權限"); }
        }

        handleFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                new THREE.TextureLoader().load(e.target.result, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    this.bgTexture = tex;
                    this.bgParams.scale = 1; // 重置縮放
                    this.bgParams.pos.set(0,0);
                    this.updateBackground();
                    this.toggleHelpers(false);
                });
            };
            reader.readAsDataURL(file);
        }

        updateBackground() {
            if (!this.bgTexture) return;
            const tex = this.bgTexture;
            const aspect = tex.image.width / tex.image.height;
            const screenAspect = window.innerWidth / window.innerHeight;

            tex.matrixAutoUpdate = false;
            let sX = 1, sY = 1;
            if (aspect > screenAspect) { sX = screenAspect / aspect; } 
            else { sY = aspect / screenAspect; }

            tex.matrix.setUvTransform(
                0.5 + this.bgParams.pos.x, 0.5 + this.bgParams.pos.y, 
                sX * this.bgParams.scale, sY * this.bgParams.scale, 
                this.bgParams.rotation, 0.5, 0.5
            );
            this.scene.background = tex;
        }

        setupGestures() {
            let lastDist = 0, lastAngle = 0;
            this.renderer.domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    lastAngle = Math.atan2(e.touches[1].pageY - e.touches[0].pageY, e.touches[1].pageX - e.touches[0].pageX);
                }
            });

            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (this.controlMode !== 'photo' || !this.bgTexture) return;
                
                if (e.touches.length === 1) {
                    this.bgParams.pos.x -= e.movementX * 0.001 / this.bgParams.scale;
                    this.bgParams.pos.y += e.movementY * 0.001 / this.bgParams.scale;
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    const angle = Math.atan2(e.touches[1].pageY - e.touches[0].pageY, e.touches[1].pageX - e.touches[0].pageX);
                    
                    if (lastDist > 0) this.bgParams.scale *= (dist / lastDist);
                    this.bgParams.rotation += (angle - lastAngle);
                    
                    lastDist = dist;
                    lastAngle = angle;
                }
                this.updateBackground();
            });
        }

        toggleHelpers(force) {
            this.helperVisible = force !== undefined ? force : !this.helperVisible;
            this.grid.visible = this.helperVisible;
            this.points.forEach(p => p.visible = (this.helperVisible && this.controlMode === 'path'));
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(15), new THREE.MeshBasicMaterial({ color, depthTest: false }));
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        async updateText() {
            const fontName = this.fontStyles[this.fontIdx].split('"')[1] || "sans-serif";
            if (fontName !== "sans-serif") await document.fonts.load(this.fontStyles[this.fontIdx]);
            
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * this.charGap;
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = this.fontStyles[this.fontIdx];
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 25;
            ctx.strokeText(char, 256, 256);
            ctx.fillStyle = document.getElementById('colorPicker').value;
            ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 18; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 1.5;
                m.material.opacity = (1 - j/18);
                g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * this.flowSpeed;
            this.charGroups?.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.8 - 0.9;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    window.onload = () => new ARFullApp();
</script>
</body>
</html>
