<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR - Media Center</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #video-source { position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8) contrast(1.3); display: none; }
        
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; color: #000; }
        .view-btn { background: #444; color: #fff; }
        .media-btn { background: #fff; color: #000; font-size: 12px; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 10px; border-radius: 6px; width: 45%; font-size: 14px; }
        .label { color: #00ffff; font-size: 10px; }
        #rec-btn { width: 50px; height: 50px; border: 4px solid #fff; background: red; border-radius: 50%; }
        #rec-btn.recording { border-radius: 10px; background: #fff; }
        
        /* 隱藏的檔案選擇器 */
        #file-input { display: none; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted loop></video>
<input type="file" id="file-input" accept="video/*,image/*">
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="ui-row">
        <input type="text" id="textInput" value="MERCEDES-BENZ">
        <input type="color" id="colorPicker" value="#ffffff" style="width:30px; height:30px; border:none; background:none;">
        <button class="btn" id="addOccluder" style="background:#ff00ff; color:#fff;">+ 遮蔽物</button>
        <button class="btn" id="updateBtn">更新</button>
    </div>
    
    <div class="ui-row">
        <span class="label">流速</span>
        <input type="range" id="speedSlider" min="1" max="100" value="15" style="width: 40%; accent-color: #00ffff;">
        <span class="label">字距</span>
        <input type="range" id="gapSlider" min="15" max="85" value="35" style="width: 40%; accent-color: #00ffff;">
    </div>

    <div class="ui-row">
        <button class="btn view-btn" id="sideView">側面深度</button>
        <button class="btn view-btn" id="frontView">正面 AR</button>
        <button class="btn media-btn" id="mediaSelect">📂 開啟媒體 / 相機</button>
        <button class="btn" id="switchCam" style="background:#ffcc00; flex:0.3;">🔄</button>
    </div>

    <div class="ui-row">
        <button class="btn" id="toggleGuide" style="background:#666; color:#fff;">隱藏輔助</button>
        <div id="rec-btn"></div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARMediaApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.charColor = new THREE.Color(0xffffff);
            this.occluders = [];
            this.flowSpeed = 0.0006; // 初始流速調慢一倍
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            this.renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 50, 450);

            this.grid = new THREE.GridHelper(600, 30, 0x00ffff, 0x222222);
            this.grid.position.y = -100;
            this.scene.add(this.grid);

            this.points = [
                this.createPoint(new THREE.Vector3(150, 0, -100), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 100, 100), 0xffff00),
                this.createPoint(new THREE.Vector3(-150, 0, -100), 0xff0000)
            ];

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('hoveron', (e) => { this.selectedObj = e.object; this.orbit.enabled = false; });
            this.drag.addEventListener('hoveroff', () => this.orbit.enabled = true);

            // 媒體選擇邏輯
            document.getElementById('mediaSelect').onclick = () => {
                const choice = confirm("點擊「確定」開啟相機，點擊「取消」從相簿/檔案選擇影片。");
                if (choice) this.setupCamera();
                else document.getElementById('file-input').click();
            };

            document.getElementById('file-input').onchange = (e) => this.handleFile(e);
            document.getElementById('addOccluder').onclick = () => this.addOccluder();
            document.getElementById('sideView').onclick = () => { this.camera.position.set(600, 0, 0); this.camera.lookAt(0,0,0); };
            document.getElementById('frontView').onclick = () => { this.camera.position.set(0, 50, 450); this.camera.lookAt(0,0,0); };
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('colorPicker').oninput = (e) => { this.charColor.set(e.target.value); this.updateText(); };
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00004; // 更細微的速度控制
            document.getElementById('gapSlider').oninput = (e) => { this.charGap = e.target.value / 100; this.updateText(); };
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecord(e.target);

            this.initPinch();
            this.updateText();
            this.animate();
        }

        async setupCamera() {
            const video = document.getElementById('video-source');
            try {
                this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = this.stream;
                this.applyBackground(video);
            } catch (e) { alert("相機啟動失敗"); }
        }

        handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const video = document.getElementById('video-source');
            video.srcObject = null;
            video.src = URL.createObjectURL(file);
            video.play();
            this.applyBackground(video);
        }

        applyBackground(video) {
            const tex = new THREE.VideoTexture(video);
            tex.colorSpace = THREE.SRGBColorSpace;
            this.scene.background = tex;
            this.toggleHelpers(false);
            document.getElementById('frontView').click();
            this.orbit.enabled = false;
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshBasicMaterial({ color, depthTest: false, transparent: true, opacity: 0.8 }));
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        addOccluder() {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 32), new THREE.MeshBasicMaterial({ color: 0x0000ff, transparent: true, opacity: 0.3 }));
            mesh.position.set(0, 50, 0);
            mesh.userData.isOccluder = true;
            this.scene.add(mesh);
            this.occluders.push(mesh);
            this.drag.getObjects().push(mesh);
        }

        initPinch() {
            let lastDist = 0;
            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && this.selectedObj) {
                    const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    if (lastDist > 0) {
                        const delta = (d - lastDist);
                        if (this.selectedObj.userData.isOccluder) {
                            const s = this.selectedObj.scale.x + delta * 0.01;
                            this.selectedObj.scale.set(s, s, s);
                        } else {
                            this.selectedObj.position.z += delta * 1.5;
                        }
                    }
                    lastDist = d;
                }
            }, { passive: false });
            this.renderer.domElement.addEventListener('touchend', () => lastDist = 0);
        }

        updateText() {
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * (this.charGap || 0.35);
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 14; ctx.strokeText(char, 256, 256);
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 15; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(35, 35), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1, color: this.charColor }));
                m.position.z = -j * 1.1;
                m.material.opacity = (1 - j/15);
                g.add(m);
            }
            return g;
        }

        toggleHelpers(forceState) {
            const s = forceState !== undefined ? forceState : !this.points[0].visible;
            this.points.forEach(p => p.visible = s);
            this.grid.visible = s;
            this.occluders.forEach(occ => {
                occ.material.colorWrite = s;
                occ.material.opacity = s ? 0.3 : 1;
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * this.flowSpeed;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            const isRec = this.recorder && this.recorder.state === "recording";
            if (isRec) this.toggleHelpers(false);
            this.renderer.render(this.scene, this.camera);
            if (isRec) this.toggleHelpers(true);
        }

        toggleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                this.recorder = new MediaRecorder(this.renderer.domElement.captureStream(30), { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `AR_Pure_Masterpiece.webm`; a.click();
                };
                this.recorder.start();
                btn.classList.add('recording');
            } else { this.recorder.stop(); btn.classList.remove('recording'); }
        }
    }
    new ARMediaApp();
</script>
</body>
</html>
