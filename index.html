<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 極光看板 (清晰強化版)</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: rgba(0, 0, 0, 0.9); padding: 15px; border-radius: 12px; color: white;
            border: 1px solid #00ffff; width: 240px;
        }
        .row { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
        input[type="text"] { width: 140px; padding: 5px; background: #1a1a1a; border: 1px solid #444; color: white; }
        input[type="range"] { width: 110px; }
        button { 
            width: 100%; padding: 10px; margin-top: 5px; background: #00ffff; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="row">文字 <input type="text" id="textInput" value="百貨公司大樓外牆"></div>
    <div class="row">顏色 <input type="color" id="colorPicker" value="#00ffff"></div>
    <div class="row">速度 <input type="range" id="speedSlider" min="0.01" max="0.1" step="0.01" value="0.04"></div>
    <div class="row">字體 <input type="range" id="fontSlider" min="150" max="400" step="10" value="300"></div>
    <div class="row">厚度 <input type="range" id="depthSlider" min="10" max="80" step="5" value="40"></div>
    <button id="updateBtn">重新生成看板</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class FlipBoardApp {
        constructor() {
            this.config = { text: "", startColor: "", baseSpeed: 0.04, radius: 15, depth: 40, fontSize: 300 };
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 500);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);
            this.camera.position.set(25, 20, 45); // 稍微拉近相機
            this.camera.lookAt(0, 5, 0);
            this.scene.add(new THREE.AmbientLight(0xffffff, 3));
            this.update();
            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            this.config.text = document.getElementById('textInput').value || " ";
            this.config.startColor = document.getElementById('colorPicker').value;
            this.config.baseSpeed = parseFloat(document.getElementById('speedSlider').value);
            this.config.fontSize = parseInt(document.getElementById('fontSlider').value);
            this.config.depth = parseInt(document.getElementById('depthSlider').value);
            this.buildBoard();
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            
            // 強制放大字體，不受總長度影響過大
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            // 繪製白色主體
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard() {
            this.charGroups.forEach(g => {
                g.children.forEach(c => {
                    c.material.map.dispose();
                    c.material.dispose();
                });
                this.scene.remove(g);
            });
            this.charGroups = [];

            const chars = this.config.text.split('');
            const geometry = new THREE.PlaneGeometry(6, 6); // 稍微放大 Plane 尺寸

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.startColor);
                    const hsl = {};
                    color.getHSL(hsl);
                    
                    if (j > 0) {
                        hsl.h += (j / this.config.depth) * 0.1;
                        hsl.l *= (0.1 + 0.45 * Math.pow(1 - j/this.config.depth, 1.5));
                    } else {
                        hsl.l = 1.0; // 第一層純白
                    }
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.1
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.06); 
                    if (j === 0) m.scale.set(1.1, 1.1, 1); // 讓正面稍微突出
                    group.add(m);
                }

                const spacing = this.config.fontSize / 50; // 動態計算字距
                group.userData = { angle: 0, state: 'straight', xStart: 30 + (i * spacing), zStart: (Math.random()-0.5)*3 };
                group.position.set(group.userData.xStart, 6, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 15;
            this.charGroups.forEach(g => {
                let s = this.config.baseSpeed;
                if (g.position.x > 0 && g.userData.state === 'straight') {
                    g.position.x -= s;
                } else if (g.userData.state !== 'done') {
                    g.userData.state = 'turning';
                    const slow = 1 - (Math.sin(g.userData.angle) * 0.6);
                    g.userData.angle += (s * slow / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = -R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else { g.userData.state = 'done'; }
                } else {
                    g.position.z -= s;
                }
                if (g.position.z < -65) {
                    g.position.set(g.userData.xStart, 6, g.userData.zStart);
                    g.rotation.y = 0; g.userData.angle = 0; g.userData.state = 'straight';
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new FlipBoardApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
