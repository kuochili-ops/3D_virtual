<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Font Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #media-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; z-index: 1; }
        #bg-image, #bg-video { flex-shrink: 0; object-fit: contain; transform-origin: center; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: auto; }
        #app-ui { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); transition: transform 0.3s; }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; font-weight: bold; border-bottom: 1px solid #333; }
        .ui-content { padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .slider-group { flex: 1; display: flex; flex-direction: column; }
        .slider-label { color: #00ffff; font-size: 10px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: #00ffff; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 10px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        .mode-btn { background: #444; color: #ccc; }
        .active-mode { background: #ffaa00 !important; color: #000 !important; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 40%; }
        #rec-btn { width: 40px; height: 40px; border: 2px solid #fff; background: red; border-radius: 50%; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1000; color: #00ffff; justify-content: center; align-items: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="loading-overlay">字型加載中...</div>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted style="display:none;"></video>
    <img id="bg-image" style="display:none;">
</div>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 收合選單</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES">
            <input type="color" id="colorPicker" value="#ffffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff; flex: 0.5;">更換字型</button>
        </div>
        <div class="ui-row">
            <div class="slider-group">
                <div class="slider-label"><span>飛行速度</span><span id="speedVal">1.0</span></div>
                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <div class="slider-label"><span>文字間距</span><span id="spacingVal">0.12</span></div>
                <input type="range" id="spacingSlider" min="0.05" max="0.5" step="0.01" value="0.12">
            </div>
        </div>
        <div class="ui-row">
            <button class="btn mode-btn active-mode" id="modePath">📍 3D 路徑</button>
            <button class="btn mode-btn" id="modePhoto">🖼️ 背景調整</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 鏡頭</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 照片</button>
            <button class="btn" id="toggleGuide" style="background:#444; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { 
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
    } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class ARFullModule {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
            
            this.params = {
                speed: 1.0,
                spacing: 0.12,
                mode: 'path',
                helpers: true,
                fontIdx: 0,
                // 精確指定字型名稱，確保 CSS 匹配
                fontFamilies: ['"Noto Serif TC"', '"Zhi Mang Xing"', '"Ma Shan Zheng"', 'sans-serif'],
                fontStyles: ['900 400px "Noto Serif TC"', '400 400px "Zhi Mang Xing"', '400 400px "Ma Shan Zheng"', '900 400px sans-serif']
            };

            this.bgParams = { scale: 1, x: 0, y: 0 };
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 200, 1000);

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.grid = new THREE.GridHelper(2000, 25, 0x00ffff, 0x333333);
            this.scene.add(this.grid);

            this.points = [
                this._createPoint(new THREE.Vector3(300, 50, 0), 0x00ff00),   
                this._createPoint(new THREE.Vector3(0, 300, 200), 0xffff00), 
                this._createPoint(new THREE.Vector3(-300, 50, 0), 0xff0000)   
            ];

            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => this.orbit.enabled = true);

            this._setupUIEvents();
            this.updateText(); // 初始調用
            this._animate();
        }

        async updateText() {
            const currentFontName = this.params.fontFamilies[this.params.fontIdx];
            const currentFontStyle = this.params.fontStyles[this.params.fontIdx];
            const text = document.getElementById('textInput').value || "";

            // 關鍵：等待特定的字型載入完成，而不是僅僅等待 document.fonts.ready
            const overlay = document.getElementById('loading-overlay');
            if (!document.fonts.check(currentFontStyle)) {
                overlay.style.display = 'flex';
                await document.fonts.load(currentFontStyle);
                overlay.style.display = 'none';
            }

            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = currentFontStyle;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 20;
                ctx.strokeText(c, 256, 256);
                ctx.fillStyle = document.getElementById('colorPicker').value;
                ctx.fillText(c, 256, 256);
                
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 20; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05, side: THREE.DoubleSide }));
                    m.position.z = -j * 2; m.material.opacity = (1 - j/20);
                    g.add(m);
                }
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        // ... (其餘 UI, 縮放, 動畫邏輯保持不變)
        _setupUIEvents() {
            const get = (id) => document.getElementById(id);
            get('speedSlider').oninput = (e) => { this.params.speed = parseFloat(e.target.value); get('speedVal').innerText = e.target.value; };
            get('spacingSlider').oninput = (e) => { this.params.spacing = parseFloat(e.target.value); get('spacingVal').innerText = e.target.value; };
            get('modePath').onclick = () => this.setMode('path');
            get('modePhoto').onclick = () => this.setMode('photo');
            get('camBtn').onclick = () => this.startCamera();
            get('openAlbum').onclick = () => get('media-input').click();
            get('media-input').onchange = (e) => this.loadPhoto(e.target.files[0]);
            get('fontToggle').onclick = () => { this.params.fontIdx = (this.params.fontIdx + 1) % 4; this.updateText(); };
            get('toggleUI').onclick = () => get('app-ui').classList.toggle('collapsed');
            get('textInput').oninput = () => this.updateText();
            get('colorPicker').oninput = () => this.updateText();
            get('toggleGuide').onclick = () => {
                this.params.helpers = !this.params.helpers;
                this.grid.visible = this.params.helpers;
                this.points.forEach(p => p.visible = this.params.helpers);
            };
        }

        setMode(m) {
            this.params.mode = m;
            this.drag.enabled = (m === 'path');
            this.orbit.enabled = (m === 'path');
            document.getElementById('modePath').classList.toggle('active-mode', m === 'path');
            document.getElementById('modePhoto').classList.toggle('active-mode', m === 'photo');
        }

        async startCamera() {
            const v = document.getElementById('bg-video'); const i = document.getElementById('bg-image');
            i.style.display = 'none'; v.style.display = 'block';
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            v.srcObject = s; this.activeEl = v; this.updateBG();
        }

        loadPhoto(file) {
            const i = document.getElementById('bg-image'); const v = document.getElementById('bg-video');
            v.style.display = 'none'; i.style.display = 'block';
            i.src = URL.createObjectURL(file); this.activeEl = i; this.updateBG();
        }

        updateBG() { if (this.activeEl) this.activeEl.style.transform = `translate(${this.bgParams.x}px, ${this.bgParams.y}px) scale(${this.bgParams.scale})`; }

        _createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(35), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 }));
            m.position.copy(pos); this.scene.add(m); return m;
        }

        _animate() {
            requestAnimationFrame(() => this._animate());
            this.orbit.update();
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = Date.now() * 0.0008 * this.params.speed;
            this.charGroups?.forEach((g, i) => {
                let t = (baseTime - i * this.params.spacing) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    window.onload = () => new ARFullModule();
</script>
</body>
</html>
