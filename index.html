<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shinjuku Cat Precision Angle</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui-box {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(0,0,0,0.75); padding: 12px; border-radius: 10px;
            border: 1px solid #00ffff; display: flex; gap: 8px;
        }
        input { padding: 8px; border-radius: 4px; border: none; background: #222; color: #fff; width: 160px; }
        button { padding: 8px 15px; border-radius: 4px; border: none; background: #00ffff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui-box">
    <input type="text" id="textInput" value="新宿3D貓拍攝視角" placeholder="輸入文字...">
    <button id="updateBtn">更新</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class ShinjukuCatView {
        constructor() {
            this.config = { speed: 0.06, depth: 55, fontSize: 300, color: "#00ffcc" };
            this.scene = new THREE.Scene();
            // 模擬手機鏡頭廣角感
            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // --- 關鍵修正：模仿照片中的地面仰視 45 度位 ---
            // x: 右側偏移, y: 地面仰視高度, z: 正面距離
            this.camera.position.set(50, 28, 65); 
            this.camera.lookAt(-12, 5, -10); // 焦點對準貓頭即將右轉的轉角中心

            this.scene.add(new THREE.AmbientLight(0xffffff, 4));
            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(9, 9);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {}; color.getHSL(hsl);
                    if (j > 0) hsl.l *= (0.12 + 0.45 * Math.pow(1 - j/this.config.depth, 1.4));
                    else hsl.l = 1.0;
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.18, side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.08); // 厚度
                    group.add(m);
                }

                const spacing = 7.5;
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', // 貓尾牆面
                    xStart: 60 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 10, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 20; // 貓頭處的轉彎半徑
            const cornerX = 0; 

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s; // 從右向左行進
                    if (g.position.x <= cornerX) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    g.userData.angle += (s / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall'; // 沒入貓頭那一側的牆
                    }
                } else {
                    g.position.z -= s; 
                }

                if (g.position.z < -100) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    const maxCharX = Math.max(...this.charGroups.map(ch => ch.position.x), 50);
                    g.position.set(maxCharX + 7.5, 10, 0);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new ShinjukuCatView();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
