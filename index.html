<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shinjuku 45° Illusion App</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #app-ui {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 255, 255, 0.3);
            display: flex; gap: 8px; width: 280px;
        }
        input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #222; color: #fff; font-size: 14px; outline: none; }
        input:focus { box-shadow: 0 0 5px #00ffff; }
        button { padding: 10px 15px; border-radius: 6px; border: none; background: #00ffff; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>

<div id="app-ui">
    <input type="text" id="textInput" value="新宿3D貓位置與角度" placeholder="輸入文字...">
    <button id="updateBtn">更新</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class ShinjukuIllusionApp {
        constructor() {
            this.config = { speed: 0.08, depth: 40, fontSize: 320, color: "#00ffcc" };
            this.scene = new THREE.Scene();
            // 使用較小的 FOV (25) 來模擬長焦攝影，減少畸變，增加錯視感
            this.camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 1, 2000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            this.charGroups = [];
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // --- 精準角度：模仿新宿 3D 貓的拍攝站點 ---
            // 站在斜前方 45 度，視線稍微與轉角中心對齊
            const distance = 120; 
            this.camera.position.set(distance, distance * 0.4, distance); 
            this.camera.lookAt(0, 0, 0); 

            this.scene.add(new THREE.AmbientLight(0xffffff, 4));
            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(10, 10);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {}; color.getHSL(hsl);
                    if (j > 0) hsl.l *= (0.2 + 0.4 * Math.pow(1 - j/this.config.depth, 1.2));
                    else hsl.l = 1.0;
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.15, side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.12); // 文字厚度
                    group.add(m);
                }

                const spacing = 12;
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', 
                    xStart: 80 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 0, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 20; // 轉向半徑
            const cornerX = 0; 

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s; 
                    if (g.position.x <= cornerX) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    const slow = 1 - (Math.sin(g.userData.angle) * 0.4);
                    g.userData.angle += (s * slow / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall';
                    }
                } else {
                    g.position.z -= s; 
                }

                if (g.position.z < -120) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    const maxCharX = Math.max(...this.charGroups.map(ch => ch.position.x), 70);
                    g.position.set(maxCharX + 12, 0, 0);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new ShinjukuIllusionApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
