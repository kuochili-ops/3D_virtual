<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Pro - Depth Visualizer</title>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .ui-row { width: 92%; display: flex; justify-content: space-around; gap: 10px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; }
        .view-btn { background: #555; color: #fff; }
        input[type="text"] { background: #000; border: 1px solid #00ffff; color: #fff; padding: 10px; border-radius: 6px; width: 80%; margin-bottom: 5px; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted style="display:none;"></video>
<div id="canvas-container"></div>

<div id="app-ui">
    <input type="text" id="textInput" value="愛到你心驚驚">
    <div class="ui-row">
        <button class="btn view-btn" id="sideView">側視圖(看深度)</button>
        <button class="btn view-btn" id="frontView">正視圖(AR)</button>
        <button class="btn" id="startCam" style="background: #fff;">📸 開啟相機</button>
    </div>
    <div class="ui-row" style="margin-top:5px;">
        <div id="rec-btn" style="width:45px; height:45px; border:3px solid #fff; background:red; border-radius:50%;"></div>
        <span style="color:#00ffff; font-size:10px;">💡 選中球體：單指平移 X/Y，雙指撐開控 Z 軸深淺</span>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class DepthARApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 50, 450);

            // 1. 3D 空間參考
            this.grid = new THREE.GridHelper(600, 30, 0x00ffff, 0x222222);
            this.grid.position.y = -100;
            this.scene.add(this.grid);

            // 2. 建立端點與深度指引線
            this.points = [
                this.createPoint(new THREE.Vector3(120, 0, -100), 0x00ff00), // 起點推遠
                this.createPoint(new THREE.Vector3(0, 80, 50), 0xffff00),     // 彎點拉近
                this.createPoint(new THREE.Vector3(-120, 0, -100), 0xff0000) // 終點推遠
            ];

            // 3. 視角與拖拽
            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;
            this.orbit.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_PAN };

            this.drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            this.drag.addEventListener('hoveron', (e) => { this.selectedPoint = e.object; this.orbit.enabled = false; });
            this.drag.addEventListener('hoveroff', () => { this.orbit.enabled = true; });

            // 4. UI 互動
            document.getElementById('sideView').onclick = () => { this.camera.position.set(500, 50, 0); this.camera.lookAt(0,0,0); };
            document.getElementById('frontView').onclick = () => { this.camera.position.set(0, 50, 450); this.camera.lookAt(0,0,0); };
            document.getElementById('startCam').onclick = () => this.startAR();
            document.getElementById('textInput').onchange = () => this.updateText();

            this.initPinchZ();
            this.updateText();
            this.animate();
        }

        createPoint(pos, color) {
            const group = new THREE.Group();
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(15), new THREE.MeshBasicMaterial({ color: color, depthTest: false }));
            
            // 垂直指引線：連到網格面
            const lineMat = new THREE.LineDashedMaterial({ color: color, dashSize: 5, gapSize: 3 });
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,-200,0)]);
            const line = new THREE.Line(lineGeo, lineMat);
            line.computeLineDistances();
            
            sphere.add(line); 
            sphere.position.copy(pos);
            sphere.renderOrder = 999;
            this.scene.add(sphere);
            return sphere;
        }

        initPinchZ() {
            let lastDist = 0;
            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && this.selectedPoint) {
                    const d = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    if (lastDist > 0) {
                        this.selectedPoint.position.z += (d - lastDist) * 0.8;
                    }
                    lastDist = d;
                }
            }, { passive: false });
            this.renderer.domElement.addEventListener('touchend', () => lastDist = 0);
        }

        async startAR() {
            const v = document.getElementById('video-source');
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            v.srcObject = s; v.play();
            this.scene.background = new THREE.VideoTexture(v);
            this.grid.visible = false;
            this.points.forEach(p => p.children[0].visible = false); // 隱藏指引線
            document.getElementById('frontView').click();
            this.orbit.enabled = false;
        }

        updateText() {
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * 0.25; 
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 25; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 0.5;
                m.material.color.setScalar(0.4 + 0.6 * (1 - j/25));
                g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.orbit.update();
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    const tan = curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tan));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    new DepthARApp();
</script>
</body>
</html>
