<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Pro - Ratio Fixed V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Long+Cang&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; height: 100vh; width: 100vw; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        #media-layer { position: absolute; visibility: hidden; pointer-events: none; }
        
        #app-ui { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); transition: transform 0.3s; border-top: 1px solid #333; }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        
        #stop-rec-overlay { 
            position: fixed; top: env(safe-area-inset-top, 20px); right: 20px; z-index: 500; 
            background: #ff0000; color: white; padding: 12px 24px; 
            border-radius: 50px; font-weight: bold; display: none; 
            border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; font-weight: bold; }
        .ui-content { padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 11px; color: #000; }
        #rec-btn { width: 50px; height: 50px; border: 3px solid #fff; background: #ff0000; border-radius: 50%; cursor: pointer; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 1000; color: #00ffff; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="stop-rec-overlay">⏹ 停止錄影並下載</div>
<div id="loading-overlay">🎥 影片合成中...</div>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted></video>
    <img id="bg-image">
</div>

<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 選單</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" style="background:#111; border:1px solid #0ff; color:#fff; padding:10px; width:45%; border-radius:5px;" value="比例校正成功">
            <input type="color" id="colorPicker" value="#ffffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff;">更換字型</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 開啟相機</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 開啟照片</button>
            <button class="btn" id="toggleGuide" style="background:#444; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class ARRatioMaster {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
            this.displayCanvas = document.createElement('canvas');
            this.ctx = this.displayCanvas.getContext('2d');
            this.params = { speed: 1.0, spacing: 0.12, helpers: true, fontIdx: 0, fontStyles: ['900 400px "Noto Serif TC"', '400 400px "Long Cang"', '400 400px "ZCOOL QingKe HuangYou"', '900 400px "Noto Sans TC"'] };
            this.activeMedia = null;
            this.isRecording = false;
            this.init();
        }

        init() {
            this._resize();
            window.addEventListener('resize', () => this._resize());
            document.getElementById('canvas-container').appendChild(this.displayCanvas);

            this.camera.position.set(0, 200, 1000);
            this.orbit = new OrbitControls(this.camera, this.displayCanvas);
            
            this.grid = new THREE.GridHelper(2000, 25, 0x00ffff, 0x333333);
            this.scene.add(this.grid);
            this.points = [this._createPoint(new THREE.Vector3(300, 50, 0), 0x00ff00), this._createPoint(new THREE.Vector3(0, 300, 200), 0xffff00), this._createPoint(new THREE.Vector3(-300, 50, 0), 0xff0000)];
            this.drag = new DragControls([...this.points], this.camera, this.displayCanvas);

            this._bindUI();
            this.updateText();
            this._renderLoop();
        }

        _resize() {
            const pr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            this.displayCanvas.width = w * pr;
            this.displayCanvas.height = h * pr;
            this.renderer.setSize(w, h);
            this.camera.aspect = w / h;
            this.camera.updateProjectionMatrix();
        }

        async startCamera() {
            try {
                const constraints = { video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const v = document.getElementById('bg-video');
                v.srcObject = stream;
                v.onloadedmetadata = () => { v.play(); this.activeMedia = v; };
            } catch (err) { alert("無法開啟相機: " + err); }
        }

        _renderLoop() {
            requestAnimationFrame(() => this._renderLoop());
            this.orbit.update();
            this._animateText();
            this.renderer.render(this.scene, this.camera);

            const cw = this.displayCanvas.width;
            const ch = this.displayCanvas.height;
            this.ctx.fillStyle = "#000";
            this.ctx.fillRect(0, 0, cw, ch);
            
            if (this.activeMedia) {
                const mw = this.activeMedia.videoWidth || this.activeMedia.naturalWidth;
                const mh = this.activeMedia.videoHeight || this.activeMedia.naturalHeight;
                
                // 🛠️ 絕對比例修正算法 (Object-fit Cover 邏輯)
                const scale = Math.max(cw / mw, ch / mh);
                const x = (cw - mw * scale) / 2;
                const y = (ch - mh * scale) / 2;

                this.ctx.drawImage(this.activeMedia, x, y, mw * scale, mh * scale);
            }
            this.ctx.drawImage(this.renderer.domElement, 0, 0, cw, ch);
        }

        _bindUI() {
            const get = (id) => document.getElementById(id);
            get('camBtn').onclick = () => this.startCamera();
            get('openAlbum').onclick = () => get('media-input').click();
            get('media-input').onchange = (e) => {
                const i = document.getElementById('bg-image');
                i.src = URL.createObjectURL(e.target.files[0]);
                i.onload = () => this.activeMedia = i;
            };
            get('rec-btn').onclick = () => this.startRecording();
            get('stop-rec-overlay').onclick = () => this.stopRecording();
            get('toggleUI').onclick = () => get('app-ui').classList.toggle('collapsed');
            get('fontToggle').onclick = () => { this.params.fontIdx = (this.params.fontIdx + 1) % 4; this.updateText(); };
            get('textInput').oninput = () => this.updateText();
            get('colorPicker').oninput = () => this.updateText();
            get('toggleGuide').onclick = () => this.toggleHelpers(true);
        }

        startRecording() {
            this.isRecording = true;
            document.getElementById('stop-rec-overlay').style.display = 'block';
            document.getElementById('app-ui').classList.add('collapsed');
            if(this.params.helpers) this.toggleHelpers();
            
            // 錄製設定
            const stream = this.displayCanvas.captureStream(30);
            const types = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
            const type = types.find(t => MediaRecorder.isTypeSupported(t));
            
            this.mediaRecorder = new MediaRecorder(stream, { mimeType: type });
            this.recordedChunks = [];
            this.mediaRecorder.ondataavailable = e => { if(e.data.size > 0) this.recordedChunks.push(e.data); };
            this.mediaRecorder.onstop = () => this._export();
            this.mediaRecorder.start();
        }

        stopRecording() {
            this.isRecording = false;
            this.mediaRecorder.stop();
            document.getElementById('stop-rec-overlay').style.display = 'none';
        }

        _export() {
            document.getElementById('loading-overlay').style.display = 'flex';
            const blob = new Blob(this.recordedChunks, { type: this.mediaRecorder.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `AR_Video_${Date.now()}.webm`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('app-ui').classList.remove('collapsed');
                this.toggleHelpers();
                URL.revokeObjectURL(url);
            }, 1000);
        }

        toggleHelpers(m=false) { if(m) this.params.helpers=!this.params.helpers; this.grid.visible=this.params.helpers; this.points.forEach(p=>p.visible=this.params.helpers); }
        _createPoint(pos, color) { const m = new THREE.Mesh(new THREE.SphereGeometry(35), new THREE.MeshBasicMaterial({ color })); m.position.copy(pos); this.scene.add(m); return m; }
        
        async updateText() {
            const style = this.params.fontStyles[this.params.fontIdx];
            if (!document.fonts.check(style)) await document.fonts.load(style);
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = style; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = document.getElementById('colorPicker').value; ctx.fillText(c, 256, 256);
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 12; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(85, 85), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                    m.position.z = -j * 2.2; g.add(m);
                }
                this.scene.add(g); this.charGroups.push(g);
            });
        }

        _animateText() {
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = Date.now() * 0.0008 * this.params.speed;
            this.charGroups?.forEach((g, i) => {
                let t = (baseTime - i * this.params.spacing) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) { const pos = curve.getPointAt(t); g.position.copy(pos); g.lookAt(pos.clone().add(curve.getTangentAt(t))); g.rotateY(Math.PI / 2); g.visible = true; } else g.visible = false;
            });
        }
    }
    window.onload = () => new ARRatioMaster();
</script>
</body>
</html>
