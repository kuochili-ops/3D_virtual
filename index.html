<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR - Sync Pro</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #media-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        #bg-video, #bg-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        #canvas-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #app-ui {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            transition: transform 0.3s ease; padding-bottom: env(safe-area-inset-bottom);
        }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; font-size: 13px; cursor: pointer; }
        .ui-content { padding: 10px 0 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 45%; }
        #rec-btn { width: 45px; height: 45px; border: 3px solid #fff; background: red; border-radius: 50%; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="media-layer">
    <video id="bg-video" autoplay playsinline muted loop webkit-playsinline></video>
    <img id="bg-img">
</div>

<div id="canvas-layer"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔽 隱藏控制台</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES-BENZ">
            <input type="color" id="colorPicker" value="#ffffff" style="width:25px; height:25px;">
            <button class="btn" id="updateBtn">更新文字</button>
        </div>
        <div class="ui-row">
            <span style="color:#00ffff; font-size:10px;">流速</span>
            <input type="range" id="speedSlider" min="1" max="100" value="15" style="width: 40%;">
            <span style="color:#00ffff; font-size:10px;">字距</span>
            <input type="range" id="gapSlider" min="5" max="50" value="15" style="width: 40%;">
        </div>
        <div class="ui-row">
            <button class="btn" id="viewToggle" style="background:#444; color:#fff;">🔄 視角切換</button>
            <button class="btn" id="openMedia" style="background:#fff;">📂 選擇媒體</button>
            <button class="btn" id="toggleGuide" style="background:#666; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*,video/*">

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARSyncApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.charGroups = [];
            this.currentView = "front";
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            this.renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-layer').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 50, 450);

            this.grid = new THREE.GridHelper(600, 20, 0x00ffff, 0x333333);
            this.grid.position.y = -80;
            this.scene.add(this.grid);

            this.points = [
                this.createPoint(new THREE.Vector3(200, 0, -150), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 150, 100), 0xffff00),
                this.createPoint(new THREE.Vector3(-200, 0, -150), 0xff0000)
            ];

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => this.orbit.enabled = true);

            const ui = document.getElementById('app-ui');
            document.getElementById('toggleUI').onclick = (e) => {
                ui.classList.toggle('collapsed');
                e.target.innerText = ui.classList.contains('collapsed') ? "🔼 展開面板" : "🔽 隱藏面板";
            };

            document.getElementById('openMedia').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.handleMedia(e.target.files[0]);
            document.getElementById('viewToggle').onclick = () => this.switchView();
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecord(e.target);
            
            this.flowSpeed = 0.0006;
            this.charGap = 0.15;
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00004;
            document.getElementById('gapSlider').oninput = (e) => { this.charGap = e.target.value / 100; };

            this.updateText();
            this.animate();
        }

        handleMedia(file) {
            if (!file) return;
            const url = URL.createObjectURL(file);
            const videoEl = document.getElementById('bg-video');
            const imgEl = document.getElementById('bg-img');
            if (file.type.startsWith('video/')) {
                imgEl.style.display = 'none'; videoEl.style.display = 'block'; videoEl.src = url; videoEl.play();
            } else {
                videoEl.style.display = 'none'; imgEl.style.display = 'block'; imgEl.src = url;
            }
            this.toggleHelpers(false);
            document.getElementById('app-ui').classList.add('collapsed');
        }

        switchView() {
            if (this.currentView === "front") {
                this.camera.position.set(650, 50, 0); this.camera.lookAt(0, 50, 0); this.currentView = "side";
            } else {
                this.camera.position.set(0, 80, 450); this.camera.lookAt(0, 50, 0); this.currentView = "front";
            }
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(20), new THREE.MeshBasicMaterial({ color, depthTest: false }));
            m.position.copy(pos);
            m.renderOrder = 9999;
            this.scene.add(m);
            return m;
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.index = i; // 紀錄是第幾個字
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'black'; ctx.lineWidth = 15; ctx.strokeText(char, 256, 256);
            ctx.fillStyle = document.getElementById('colorPicker').value; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 12; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 1.5; m.material.opacity = (1 - j/12); m.renderOrder = 500;
                g.add(m);
            }
            return g;
        }

        toggleHelpers(forceState) {
            const s = forceState !== undefined ? forceState : !this.points[0].visible;
            this.points.forEach(p => p.visible = s);
            this.grid.visible = s;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = (Date.now() * this.flowSpeed) % 2.0;
            
            this.charGroups.forEach(g => {
                // 核心同步邏輯：每個字的位移嚴格等於 (基礎時間 - 索引 * 字距)
                let t = (baseTime - g.userData.index * this.charGap);
                
                // 循環處理，確保文字源源不絕
                while (t < 0) t += 2.0;
                t = t % 2.0;

                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else {
                    g.visible = false;
                }
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = []; this.toggleHelpers(false);
                const stream = this.renderer.domElement.captureStream(30);
                this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `Mercedes_Sync.webm`; a.click();
                    this.toggleHelpers(true);
                };
                this.recorder.start();
                btn.style.background = "#fff";
            } else { this.recorder.stop(); btn.style.background = "red"; }
        }
    }
    new ARSyncApp();
</script>
</body>
</html>
