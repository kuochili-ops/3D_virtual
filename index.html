<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Studio Pro</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #video-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .ui-row { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { background: #222; border: 1px solid #00ffff; color: #fff; padding: 12px; border-radius: 8px; width: 60%; font-size: 16px; }
        
        #rec-btn { width: 75px; height: 75px; border-radius: 50%; border: 5px solid #fff; background: red; cursor: pointer; }
        #rec-btn.active { border-radius: 15px; background: #fff; transform: scale(0.8); }
        .btn-action { background: #00ffff; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<video id="video-bg" autoplay playsinline muted></video>
<div id="three-canvas"></div>

<div id="app-ui">
    <div class="ui-row">
        <input type="text" id="textInput" value="愛到你心驚驚">
        <button class="btn-action" id="updateBtn">確認文字</button>
    </div>
    <div class="ui-row">
        <button class="btn-action" id="toggleGuide" style="background:#555; color:#fff;">顯示/隱藏路徑</button>
        <input type="range" id="speedSlider" min="1" max="50" value="8" style="width: 50%; accent-color: #00ffff;">
    </div>
    <div id="rec-btn"></div>
    <button id="startCam" style="background:none; border:none; color:#00ffff; font-size:12px;">[ 1. 點此開啟相機 ]</button>
</div>

<canvas id="mix-canvas" style="display:none;"></canvas>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARModule {
        constructor() {
            this.config = { speed: 0.0008, showGuides: true };
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            this.charGroups = [];
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('three-canvas').appendChild(this.renderer.domElement);
            
            // 視角與燈光
            this.camera.position.set(0, 0, 200);
            this.scene.add(new THREE.AmbientLight(0xffffff, 3));

            // 初始化路徑球 (確保 Z 軸在前方)
            this.points = [
                this.createPoint(new THREE.Vector3(80, 0, 50), "Start"), 
                this.createPoint(new THREE.Vector3(0, 40, 50), "Corner"),    
                this.createPoint(new THREE.Vector3(-80, 0, 50), "End") 
            ];

            const drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            
            // 事件綁定
            document.getElementById('startCam').onclick = async () => {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video-bg').srcObject = s;
            };

            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('speedSlider').oninput = (e) => this.config.speed = e.target.value * 0.0001;
            document.getElementById('toggleGuide').onclick = () => {
                this.config.showGuides = !this.config.showGuides;
                this.points.forEach(p => p.visible = this.config.showGuides);
            };

            document.getElementById('rec-btn').onclick = () => this.toggleRecord();

            this.updatePath();
            this.updateText();
            this.animate();
        }

        createPoint(pos) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(8), 
                new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8, depthTest: false })
            );
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        updatePath() {
            this.curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            const chars = text.split(''); 
            
            chars.forEach((c, i) => {
                const g = new THREE.Group();
                const tex = this.createTexture(c);
                for (let j = 0; j < 30; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
                    m.position.z = -j * 0.2;
                    m.material.color.setScalar(0.4 + 0.6 * (1 - j/30));
                    g.add(m);
                }
                g.userData.tOffset = -i * 0.2; // 第一個字領頭
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createTexture(char) {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.updatePath();
            const time = Date.now() * this.config.speed;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = this.curve.getPointAt(t);
                    const tan = this.curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tan));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecord() {
            const btn = document.getElementById('rec-btn');
            if (!this.recorder || this.recorder.state === "inactive") {
                this.startRecording();
                btn.classList.add('active');
            } else {
                this.recorder.stop();
                btn.classList.remove('active');
            }
        }

        async startRecording() {
            this.chunks = [];
            // 關鍵：同時抓取相機與 3D 畫布並嘗試合併（部分手機支援 Canvas 錄製混合）
            const stream = this.renderer.domElement.captureStream(30);
            this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            this.recorder.ondataavailable = e => this.chunks.push(e.data);
            this.recorder.onstop = () => {
                const blob = new Blob(this.chunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'ar_video.webm'; a.click();
            };
            this.recorder.start();
        }
    }

    new ARModule();
</script>
</body>
</html>
