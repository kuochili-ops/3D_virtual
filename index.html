<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D Stacked Chinese Marquee App</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; color: white;
        }
        input { padding: 8px; border: none; border-radius: 4px; width: 150px; }
        button { padding: 8px 15px; background: #00ffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui">
        <input type="text" id="textInput" value="立體中文" placeholder="輸入文字...">
        <button id="updateBtn">發送</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. 初始化 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 15);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 環境光
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        scene.add(new THREE.GridHelper(20, 10, 0x333333, 0x222222));

        // --- 2. 核心：堆疊立體字產生器 ---
        function createStackedChar(char) {
            const group = new THREE.Group();
            const layers = 10;    // 堆疊層數，越多側邊越密實
            const depthStep = 0.05; // 每層間距，決定總厚度

            // 預先準備 Canvas
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 180px "Microsoft JhengHei", "微軟正黑體", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < layers; i++) {
                // 模擬側面陰影：前面的字亮，後面的字暗
                const colorVal = i === 0 ? '#00ffff' : `rgb(0, ${150 - i * 10}, ${200 - i * 15})`;
                ctx.clearRect(0, 0, 256, 256);
                ctx.fillStyle = colorVal;
                ctx.fillText(char, 128, 128);

                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true,
                    depthWrite: true 
                });

                const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
                plane.position.z = -(i * depthStep); // 沿著 Z 軸推疊
                group.add(plane);
            }
            return group;
        }

        // --- 3. 跑馬燈控制器 ---
        let charGroups = [];
        const startX = 12;
        const turnX = -6;

        function initMarquee(text) {
            charGroups.forEach(g => scene.remove(g));
            charGroups = [];
            
            const chars = text.split('');
            chars.forEach((c, i) => {
                const g = createStackedChar(c);
                g.position.set(startX + (i * 2.8), 4, 3);
                scene.add(g);
                charGroups.push(g);
            });
        }

        // --- 4. 動畫循環 (逐字路徑邏輯) ---
        function animate() {
            requestAnimationFrame(animate);
            
            charGroups.forEach((group) => {
                // 狀態 A：向左移動
                if (group.position.x > turnX) {
                    group.position.x -= 0.07;
                } 
                // 狀態 B：右轉進門 (旋轉 90 度並深入 Z 軸)
                else {
                    if (group.rotation.y > -Math.PI / 2) {
                        group.rotation.y -= 0.1;
                    }
                    group.position.z -= 0.1;
                }

                // 循環重置
                if (group.position.z < -10) {
                    group.position.set(startX + 2, 4, 3);
                    group.rotation.y = 0;
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = () => {
            initMarquee(document.getElementById('textInput').value);
        };

        // 初始化
        initMarquee("立體中文");
        animate();
    </script>
</body>
</html>
