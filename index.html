<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR - Fix Pro</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 14px 5px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; color: #000; }
        .media-btn { background: #fff; border: 2px solid #00ffff; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 10px; border-radius: 8px; width: 45%; font-size: 14px; }
        #rec-btn { width: 55px; height: 55px; border: 4px solid #fff; background: red; border-radius: 50%; }
        #rec-btn.recording { border-radius: 12px; background: #fff; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<input type="file" id="media-input" accept="image/*,video/*">
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="ui-row">
        <input type="text" id="textInput" value="MERCEDES-BENZ">
        <input type="color" id="colorPicker" value="#ffffff" style="width:30px; height:30px;">
        <button class="btn" id="updateBtn">更新</button>
    </div>
    <div class="ui-row">
        <span style="color:#00ffff; font-size:10px;">流速</span>
        <input type="range" id="speedSlider" min="1" max="100" value="15" style="width: 40%;">
        <span style="color:#00ffff; font-size:10px;">字距</span>
        <input type="range" id="gapSlider" min="15" max="85" value="35" style="width: 40%;">
    </div>
    <div class="ui-row">
        <button class="btn" id="viewToggle" style="background:#444; color:#fff;">🔄 視角切換</button>
        <button class="btn media-btn" id="openMedia">📂 選擇媒體 (相機/相簿)</button>
        <button class="btn" id="toggleGuide" style="background:#666; color:#fff; flex:0.4;">👁️</button>
        <div id="rec-btn"></div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARFixApp {
        constructor() {
            this.scene = new THREE.Scene();
            // alpha: true 與 premultipliedAlpha 確保背景能穿透
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.currentView = "front";
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            this.renderer.outputColorSpace = THREE.SRGBColorSpace;
            // 關鍵：將背景設置為透明，背景由 scene.background 掌控
            this.renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            
            this.camera.position.set(0, 50, 450);

            this.grid = new THREE.GridHelper(600, 20, 0x00ffff, 0x222222);
            this.grid.position.y = -100;
            this.scene.add(this.grid);

            // 路徑球設置
            this.points = [
                this.createPoint(new THREE.Vector3(150, 0, -100), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 100, 100), 0xffff00),
                this.createPoint(new THREE.Vector3(-150, 0, -100), 0xff0000)
            ];

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('hoveron', (e) => { this.orbit.enabled = false; });
            this.drag.addEventListener('hoveroff', () => { this.orbit.enabled = true; });

            // UI 綁定
            document.getElementById('openMedia').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.handleMedia(e.target.files[0]);
            document.getElementById('viewToggle').onclick = () => this.switchView();
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecord(e.target);
            
            // 滑桿與色彩
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00004;
            document.getElementById('gapSlider').oninput = (e) => { this.charGap = e.target.value / 100; this.updateText(); };
            this.flowSpeed = 0.0006;

            this.updateText();
            this.animate();
        }

        handleMedia(file) {
            if (!file) return;
            const url = URL.createObjectURL(file);
            const isVideo = file.type.startsWith('video/');
            
            if (isVideo) {
                const vid = document.createElement('video');
                vid.src = url; vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
                vid.play();
                const tex = new THREE.VideoTexture(vid);
                tex.colorSpace = THREE.SRGBColorSpace;
                this.scene.background = tex;
            } else {
                new THREE.TextureLoader().load(url, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    this.scene.background = tex;
                });
            }
            this.toggleHelpers(false); // 選完自動進入拍攝模式
        }

        switchView() {
            if (this.currentView === "front") {
                this.camera.position.set(600, 0, 0);
                this.camera.lookAt(0, 0, 0);
                this.currentView = "side";
            } else {
                this.camera.position.set(0, 50, 450);
                this.camera.lookAt(0, 0, 0);
                this.currentView = "front";
            }
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(15), new THREE.MeshBasicMaterial({ color, depthTest: false }));
            m.position.copy(pos);
            m.renderOrder = 999; // 確保輔助球在最前
            this.scene.add(m);
            return m;
        }

        updateText() {
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * (this.charGap || 0.35);
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'black'; ctx.lineWidth = 15; ctx.strokeText(char, 256, 256);
            ctx.fillStyle = document.getElementById('colorPicker').value; ctx.fillText(char, 256, 256);
            
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 15; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 1.2;
                m.material.opacity = (1 - j/15);
                g.add(m);
            }
            return g;
        }

        toggleHelpers() {
            const s = !this.points[0].visible;
            this.points.forEach(p => p.visible = s);
            this.grid.visible = s;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * this.flowSpeed;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                this.toggleHelpers(); // 錄影前自動隱藏輔助
                const stream = this.renderer.domElement.captureStream(30);
                this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `FlipBoard_Final.webm`; a.click();
                };
                this.recorder.start();
                btn.classList.add('recording');
            } else { this.recorder.stop(); btn.classList.remove('recording'); this.toggleHelpers(); }
        }
    }
    new ARFixApp();
</script>
</body>
</html>
