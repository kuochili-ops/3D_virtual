<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Billboard - Shinjuku Style</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; cursor: none; }
        /* 隱藏 UI，僅在需要時呼叫 */
        #config-trigger { position: absolute; top: 0; right: 0; width: 50px; height: 50px; z-index: 1000; opacity: 0; }
    </style>
</head>
<body>

<div id="config-trigger"></div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class Shinjuku3DApp {
        constructor() {
            this.config = {
                text: "全螢幕 3D 視覺錯視看板測試",
                color: "#00ffcc",
                speed: 0.05,
                depth: 35, // 穩定版厚度
                fontSize: 350
            };
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.charGroups = [];
            
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // 仿新宿貓咪視角：斜上方俯瞰
            this.camera.position.set(40, 30, 50);
            this.camera.lookAt(0, 0, 0);

            // 強化環境光
            const ambient = new THREE.AmbientLight(0xffffff, 3);
            this.scene.add(ambient);

            this.buildBoard();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];

            const chars = this.config.text.split('');
            const geometry = new THREE.PlaneGeometry(8, 8); // 放大尺寸增加震撼感

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {};
                    color.getHSL(hsl);
                    
                    if (j > 0) {
                        hsl.l *= (0.1 + 0.4 * Math.pow(1 - j/this.config.depth, 1.5));
                    } else {
                        hsl.l = 1.0; 
                    }
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.2
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.08); 
                    if (j === 0) m.scale.set(1.05, 1.05, 1);
                    group.add(m);
                }

                // 初始位置設定在右側深處 (仿新宿牆面起點)
                const spacing = 6;
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', 
                    xStart: 50 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 0, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 20; // 轉彎半徑
            const cornerX = 0; // 轉角坐標

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s;
                    if (g.position.x <= cornerX) {
                        g.userData.state = 'turning';
                    }
                } else if (g.userData.state === 'turning') {
                    const slow = 1 - (Math.sin(g.userData.angle) * 0.4);
                    g.userData.angle += (s * slow / R);
                    
                    if (g.userData.angle < Math.PI / 2) {
                        // 轉向公式
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall';
                    }
                } else {
                    // 往左牆遠處消失
                    g.position.z -= s;
                }

                // 重生判定
                if (g.position.z < -80) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    g.position.set(g.userData.xStart, 0, g.userData.zStart);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    new Shinjuku3DApp();
</script>
</body>
</html>
