<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 逐字立體模組 (自動降級版)</title>
    <style>
        body { margin: 0; background-color: #050505; overflow: hidden; color: white; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #333; }
        #status { position: absolute; bottom: 20px; left: 20px; font-size: 14px; color: #00ffff; }
        button { padding: 8px 12px; cursor: pointer; background: #00ffff; border: none; font-weight: bold; border-radius: 4px; }
        input { padding: 8px; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="ui">
        <input type="text" id="textInput" value="3D MARQUEE" placeholder="輸入文字...">
        <button id="updateBtn">更新畫面</button>
    </div>
    <div id="status">正在載入 3D 資源...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        const statusEl = document.getElementById('status');

        // --- 1. 場景基礎 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 15);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050505);
        document.body.appendChild(renderer.domElement);

        // 燈光：設定強烈的側光來突顯厚度
        const light = new THREE.DirectionalLight(0xffffff, 2.5);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        // 網格確認場景啟動
        scene.add(new THREE.GridHelper(20, 10, 0x444444, 0x222222));

        // --- 2. 字體加載邏輯 ---
        const loader = new FontLoader();
        let currentFont = null;
        let charMeshes = [];

        // 嘗試載入中文字體，若失敗則載入英文字體
        const chineseFont = 'https://raw.githubusercontent.com/Mr-S0m30n3/three-fonts/master/fonts/noto/noto_sans_tc_regular.json';
        const fallbackFont = 'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json';

        function loadFont(url, isFallback = false) {
            loader.load(url, 
                (font) => {
                    currentFont = font;
                    statusEl.innerText = isFallback ? "載入中文字體失敗，已切換為英文模式。" : "中文立體字體載入成功！";
                    createMarquee(document.getElementById('textInput').value);
                    animate();
                },
                null,
                (err) => {
                    if (!isFallback) {
                        statusEl.innerText = "嘗試載入中文失敗，切換中...";
                        loadFont(fallbackFont, true); // 切換到英文字體
                    } else {
                        statusEl.innerText = "字體全部載入失敗，請檢查網路。";
                    }
                }
            );
        }

        loadFont(chineseFont);

        // --- 3. 逐字生成模組 (具備真實側邊厚度) ---
        function createMarquee(text) {
            charMeshes.forEach(m => scene.remove(m));
            charMeshes = [];

            const chars = text.split('');
            chars.forEach((char, i) => {
                const geometry = new TextGeometry(char, {
                    font: currentFont,
                    size: 1.8,
                    height: 0.8,      // 文字的真實厚度
                    curveSegments: 4,
                    bevelEnabled: true,
                    bevelThickness: 0.1,
                    bevelSize: 0.05
                });

                // 正面亮藍色，側面深藍色
                const materialFace = new THREE.MeshPhongMaterial({ color: 0x00ffff, shininess: 100 });
                const materialSide = new THREE.MeshPhongMaterial({ color: 0x004488 });
                
                const mesh = new THREE.Mesh(geometry, [materialFace, materialSide]);
                
                // 設定初始位置 (右側排隊)
                mesh.position.set(8 + (i * 2.5), 3, 2);
                scene.add(mesh);
                charMeshes.push(mesh);
            });
        }

        // --- 4. 動畫與路徑 (右後 -> 左前 -> 右轉消失) ---
        function animate() {
            requestAnimationFrame(animate);
            
            charMeshes.forEach((mesh, i) => {
                // 階段 A：向左移動
                if (mesh.position.x > -5) {
                    mesh.position.x -= 0.06;
                } 
                // 階段 B：到達左前緣，右轉進門
                else {
                    if (mesh.rotation.y > -Math.PI / 2) {
                        mesh.rotation.y -= 0.1;
                    }
                    mesh.position.z -= 0.1; // 往深處走
                }

                // 循環重置 (當文字完全消失後)
                if (mesh.position.z < -10) {
                    mesh.position.set(10 + (charMeshes.length * 0.5), 3, 2);
                    mesh.rotation.y = 0;
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = () => {
            if (currentFont) createMarquee(document.getElementById('textInput').value);
        };
    </script>
</body>
