<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR Ultra Stable</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #video-preview { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            transition: transform 0.3s; padding-bottom: env(safe-area-inset-bottom);
        }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; font-size: 13px; cursor: pointer; }
        .ui-content { padding: 10px 0 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .btn { flex: 1; background: #00ffff; border: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 11px; color: #000; }
        .mode-btn { background: #444; color: #ccc; }
        .active-mode { background: #ffaa00 !important; color: #000 !important; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 8px; border-radius: 6px; width: 35%; }
        #rec-btn { width: 45px; height: 45px; border: 3px solid #fff; background: red; border-radius: 50%; }
        span { color: #00ffff; font-size: 10px; }
    </style>
</head>
<body>

<video id="video-preview" autoplay playsinline muted></video>
<input type="file" id="media-input" accept="image/*" style="display:none;">
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔼 展開設定面板</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES">
            <input type="color" id="colorPicker" value="#ffffff">
            <button class="btn" id="fontToggle" style="background:#ff00ff; color:#fff;">🔠 切換字型</button>
        </div>
        <div class="ui-row">
            <button class="btn mode-btn active-mode" id="modePath">📍 路徑模式</button>
            <button class="btn mode-btn" id="modePhoto">🖼️ 照片模式</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 啟動相機</button>
            <button class="btn" id="openAlbum" style="background:#fff;">📂 讀取照片</button>
            <button class="btn" id="toggleGuide" style="background:#666; color:#fff; flex:0.3;">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARStabilizedEngine {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
            
            this.renderer.outputColorSpace = THREE.SRGBColorSpace;
            this.renderer.toneMapping = THREE.NoToneMapping; 

            this.bgParams = { scale: 1, pos: new THREE.Vector3(0, 0, -1000) };
            this.controlMode = 'path'; 
            this.fontIdx = 0;
            this.fontStyles = ['900 400px "Noto Serif TC"', '400 400px "Zhi Mang Xing"', '400 400px "Ma Shan Zheng"', '900 400px sans-serif'];

            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.z = 800;

            // 1. 建立背景平面 (位於 3D 空間遠端)
            this.bgMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
            this.bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.bgMat);
            this.scene.add(this.bgMesh);

            // 2. 輔助元件
            this.grid = new THREE.GridHelper(1000, 20, 0x00ffff, 0x222222);
            this.grid.position.y = -150;
            this.scene.add(this.grid);

            this.points = [
                this.createPoint(new THREE.Vector3(200, 0, 0), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 200, 100), 0xffff00),
                this.createPoint(new THREE.Vector3(-200, 0, 0), 0xff0000)
            ];

            this.dragControls = new DragControls([...this.points], this.camera, this.renderer.domElement);
            
            // UI 綁定
            document.getElementById('modePath').onclick = () => this.setMode('path');
            document.getElementById('modePhoto').onclick = () => this.setMode('photo');
            document.getElementById('camBtn').onclick = () => this.startCamera();
            document.getElementById('openAlbum').onclick = () => document.getElementById('media-input').click();
            document.getElementById('media-input').onchange = (e) => this.loadFile(e.target.files[0]);
            document.getElementById('fontToggle').onclick = () => { this.fontIdx = (this.fontIdx+1)%4; this.updateText(); };
            document.getElementById('toggleGuide').onclick = () => this.toggleHelpers();
            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('colorPicker').oninput = () => this.updateText();
            document.getElementById('toggleUI').onclick = () => document.getElementById('app-ui').classList.toggle('collapsed');

            this.setupGestures();
            this.updateText();
            this.animate();
        }

        // 核心修正：計算實體比例
        resizeBGPlane() {
            if (!this.bgMat.map) return;
            const img = this.bgMat.map.image;
            const imgW = img.videoWidth || img.width;
            const imgH = img.videoHeight || img.height;
            const aspect = imgW / imgH;

            // 根據寬度適配，計算出在 z=-1000 處所需的平面尺寸
            const dist = this.camera.position.z - this.bgParams.pos.z;
            const vFov = (this.camera.fov * Math.PI) / 180;
            const planeHeight = 2 * Math.tan(vFov / 2) * dist;
            const planeWidth = planeHeight * (window.innerWidth / window.innerHeight);

            this.bgMesh.scale.set(planeWidth * this.bgParams.scale, (planeWidth / aspect) * this.bgParams.scale, 1);
            this.bgMesh.position.copy(this.bgParams.pos);
        }

        async startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const video = document.getElementById('video-preview');
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                const tex = new THREE.VideoTexture(video);
                tex.colorSpace = THREE.SRGBColorSpace;
                this.bgMat.map = tex;
                this.bgMat.needsUpdate = true;
                this.resizeBGPlane();
                this.toggleHelpers(false);
            };
        }

        loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                new THREE.TextureLoader().load(e.target.result, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    this.bgMat.map = tex;
                    this.bgParams.scale = 1;
                    this.bgParams.pos.set(0,0,-1000);
                    this.resizeBGPlane();
                    this.toggleHelpers(false);
                });
            };
            reader.readAsDataURL(file);
        }

        setupGestures() {
            let lastX = 0, lastY = 0, lastDist = 0;
            this.renderer.domElement.addEventListener('touchstart', (e) => {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                if (e.touches.length === 2) {
                    lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                }
            });

            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (this.controlMode !== 'photo' || !this.bgMat.map) return;
                e.preventDefault();

                if (e.touches.length === 1) {
                    const dx = e.touches[0].clientX - lastX;
                    const dy = e.touches[0].clientY - lastY;
                    this.bgParams.pos.x += dx * 1.5;
                    this.bgParams.pos.y -= dy * 1.5;
                    lastX = e.touches[0].clientX;
                    lastY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    if (lastDist > 0) this.bgParams.scale *= (dist / lastDist);
                    lastDist = dist;
                }
                this.resizeBGPlane();
            }, { passive: false });
        }

        setMode(m) {
            this.controlMode = m;
            document.getElementById('modePath').classList.toggle('active-mode', m === 'path');
            document.getElementById('modePhoto').classList.toggle('active-mode', m === 'photo');
            this.dragControls.enabled = (m === 'path');
            this.points.forEach(p => p.visible = (m === 'path' && this.helperVisible));
        }

        toggleHelpers(f) {
            this.helperVisible = f !== undefined ? f : !this.helperVisible;
            this.grid.visible = this.helperVisible;
            this.points.forEach(p => p.visible = (this.helperVisible && this.controlMode === 'path'));
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(15), new THREE.MeshBasicMaterial({ color, depthTest: false }));
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        async updateText() {
            await document.fonts.ready;
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = this.fontStyles[this.fontIdx];
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000'; ctx.lineWidth = 20;
                ctx.strokeText(c, 256, 256);
                ctx.fillStyle = document.getElementById('colorPicker').value;
                ctx.fillText(c, 256, 256);
                
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 18; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                    m.position.z = -j * 1.8;
                    m.material.opacity = (1 - j/18);
                    g.add(m);
                }
                g.userData.tOffset = -i * 0.12;
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups?.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    window.onload = () => new ARStabilizedEngine();
</script>
</body>
</html>
