<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Studio - Pro 3D Editor</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.8); padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { background: #111; border: 1px solid #00ffff; color: #fff; padding: 10px; border-radius: 6px; width: 65%; }
        .btn { background: #00ffff; border: none; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 12px; }
        .status-hint { color: #fff; font-size: 10px; opacity: 0.7; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted style="display:none;"></video>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="status-hint">💡 選定球體後：單指平移，雙指縮放控遠近 | 空白處雙指控視角</div>
    <div class="ui-row">
        <input type="text" id="textInput" value="愛到你心驚驚">
        <button class="btn" id="updateBtn">更新文字</button>
    </div>
    <div class="ui-row">
        <button class="btn" id="startCam" style="background:#fff;">📸 進入實景</button>
        <button class="btn" id="resetView" style="background:#444; color:#fff;">重設視角</button>
        <div id="rec-btn" style="width:50px; height:50px; border:3px solid #fff; background:red; border-radius:50%;"></div>
    </div>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ProARApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 150, 400);

            // 1. 環境輔助
            this.grid = new THREE.GridHelper(500, 20, 0x00ffff, 0x222222);
            this.grid.position.y = -80;
            this.scene.add(this.grid);

            // 2. 初始化彩色端點與選定外框
            this.points = [
                this.createPoint(new THREE.Vector3(120, 0, 0), 0x00ff00), // 起
                this.createPoint(new THREE.Vector3(0, 80, 50), 0xffff00),  // 彎
                this.createPoint(new THREE.Vector3(-120, 0, 0), 0xff0000) // 終
            ];

            // 3. 視角控制 (空白處雙指)
            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;
            this.orbit.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_PAN }; // 讓出單指給拖拽

            // 4. 拖拽控制 (單指)
            this.drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            
            // 選定邏輯：顯示外框
            this.selectionRing = new THREE.Mesh(
                new THREE.RingGeometry(18, 22, 32),
                new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, depthTest: false })
            );
            this.selectionRing.visible = false;
            this.scene.add(this.selectionRing);

            this.drag.addEventListener('hoveron', (e) => {
                this.selectedPoint = e.object;
                this.selectionRing.visible = true;
                this.selectionRing.position.copy(e.object.position);
                this.orbit.enabled = false; // 選中點時停止旋轉視角
            });
            this.drag.addEventListener('drag', (e) => {
                this.selectionRing.position.copy(e.object.position);
            });
            this.drag.addEventListener('hoveroff', () => {
                this.orbit.enabled = true;
            });

            // 5. 遠近控制 (雙指 Pinch)
            this.renderer.domElement.addEventListener('wheel', (e) => this.handleZScroll(e));
            this.initTouchZ();

            // UI 綁定
            document.getElementById('startCam').onclick = () => this.startAR();
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('resetView').onclick = () => { this.camera.position.set(0, 150, 400); this.orbit.reset(); };

            this.updateText();
            this.animate();
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(14), 
                new THREE.MeshBasicMaterial({ color: color, depthTest: false })
            );
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        initTouchZ() {
            let initialDist = 0;
            this.renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && this.selectedPoint) {
                    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    if (initialDist > 0) {
                        const delta = (dist - initialDist) * 0.5;
                        this.selectedPoint.position.z += delta; // 放大拉近，縮小推遠
                        this.selectionRing.position.copy(this.selectedPoint.position);
                    }
                    initialDist = dist;
                }
            }, { passive: false });
            this.renderer.domElement.addEventListener('touchend', () => { initialDist = 0; });
        }

        async startAR() {
            const video = document.getElementById('video-source');
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = s; video.play();
            this.scene.background = new THREE.VideoTexture(video);
            this.grid.visible = false;
            this.camera.position.set(0, 0, 400);
            this.orbit.enabled = false; // 實景模式關閉視角旋轉
        }

        updateText() {
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * 0.25; 
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 25; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(28, 28), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 0.4;
                m.material.color.setScalar(0.4 + 0.6 * (1 - j/25));
                g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.orbit.update();
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    const tan = curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tan));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
            this.selectionRing.lookAt(this.camera.position); // 外框永遠朝向鏡頭
        }
    }
    new ProARApp();
</script>
</body>
</html>
