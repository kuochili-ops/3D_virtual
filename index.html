<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Studio - Perfect Flow</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #video-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        #three-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 25px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
            box-sizing: border-box;
        }
        .control-group { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { background: rgba(255,255,255,0.2); border: 1px solid #00ffff; color: #fff; padding: 10px; border-radius: 8px; width: 65%; font-size: 16px; }
        
        #rec-btn {
            width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff;
            background: red; cursor: pointer; transition: all 0.2s;
        }
        #rec-btn.active { border-radius: 15px; transform: scale(0.8); background: #fff; }
        
        .small-btn { background: #00ffff; color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<video id="video-bg" autoplay playsinline></video>
<div id="three-canvas"></div>

<div id="app-ui">
    <div class="control-group">
        <input type="text" id="textInput" value="愛到你心驚驚">
        <button class="small-btn" id="toggleGuide">隱藏路徑球</button>
    </div>
    <div class="control-group">
        <span style="color: #00ffff; font-size: 11px;">慢速 ←→ 快速</span>
        <input type="range" id="speedSlider" min="1" max="50" value="8" style="width: 70%; accent-color: #00ffff;">
    </div>
    <div id="rec-btn"></div>
    <button id="startCam" style="background:none; border:none; color:#aaa; font-size:11px; margin-top:5px;">[ 點擊啟動相機 ]</button>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARPerfectApp {
        constructor() {
            this.config = { speed: 0.0008, showGuides: true };
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.charGroups = [];
            this.recorder = null;
            this.chunks = [];
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('three-canvas').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 15, 150);
            this.scene.add(new THREE.AmbientLight(0xffffff, 5));

            this.points = [
                this.createPoint(new THREE.Vector3(70, 0, -30)),  // 右起點
                this.createPoint(new THREE.Vector3(0, 0, 10)),    // 中間點
                this.createPoint(new THREE.Vector3(-70, 0, -30)) // 左終點
            ];

            const drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            drag.addEventListener('drag', () => this.updatePath());

            document.getElementById('startCam').onclick = async () => {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('video-bg').srcObject = stream;
            };

            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('speedSlider').oninput = (e) => this.config.speed = e.target.value * 0.0001;
            document.getElementById('toggleGuide').onclick = (e) => {
                this.config.showGuides = !this.config.showGuides;
                this.points.forEach(p => p.visible = this.config.showGuides);
                e.target.textContent = this.config.showGuides ? "隱藏路徑球" : "顯示路徑球";
            };

            document.getElementById('rec-btn').onclick = () => this.toggleRecord();

            this.updatePath();
            this.updateText();
            this.animate();
        }

        createPoint(pos) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 }));
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        updatePath() {
            this.curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            
            // 關鍵：將文字順序反轉，讓第一個字出現在路徑最前方
            const chars = text.split('').reverse(); 

            chars.forEach((c, i) => {
                const g = new THREE.Group();
                const tex = this.createTexture(c);
                for (let j = 0; j < 35; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.2, side: THREE.DoubleSide }));
                    m.position.z = -j * 0.15;
                    m.material.color.setScalar(0.4 + 0.6 * (1 - j/35));
                    g.add(m);
                }
                // 反轉後的 i 剛好對應從右到左的間距
                g.userData.tOffset = i * 0.18; 
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createTexture(char) {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.font = 'bold 380px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const time = Date.now() * this.config.speed;
            this.charGroups.forEach(g => {
                // 流向邏輯：文字從 t=0 (右) 出現，流向 t=1 (左)
                let t = (time + g.userData.tOffset) % 1.8 - 0.4; 
                
                if (t >= 0 && t <= 1) {
                    const pos = this.curve.getPointAt(t);
                    const tangent = this.curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tangent));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecord() {
            const btn = document.getElementById('rec-btn');
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                const stream = this.renderer.domElement.captureStream(30);
                const types = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
                let type = types.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
                
                this.recorder = new MediaRecorder(stream, { mimeType: type });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: type });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'ar_video.' + (type.includes('mp4') ? 'mp4' : 'webm');
                    a.click();
                };
                this.recorder.start();
                btn.classList.add('active');
            } else {
                this.recorder.stop();
                btn.classList.remove('active');
            }
        }
    }
    new ARPerfectApp();
</script>
</body>
</html>
