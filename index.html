<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Studio - 3D Simulation Mode</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; }
        #app-ui {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            padding: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .ui-row { width: 90%; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { background: #222; border: 2px solid #00ffff; color: #fff; padding: 10px; border-radius: 8px; width: 60%; font-size: 16px; }
        #rec-btn { width: 60px; height: 60px; border-radius: 50%; border: 4px solid #fff; background: red; cursor: pointer; }
        #rec-btn.recording { border-radius: 12px; background: #fff; }
        .btn { background: #00ffff; color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .hint { color: #00ffff; font-size: 11px; margin-bottom: 5px; }
    </style>
</head>
<body>

<video id="video-source" autoplay playsinline muted style="display:none;"></video>
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="hint">💡 拖拽彩色球設定 3D 路徑（綠:起、黃:彎、紅:終）</div>
    <div class="ui-row">
        <input type="text" id="textInput" value="愛到你心驚驚">
        <button class="btn" id="updateBtn">更新文字</button>
    </div>
    <div class="ui-row">
        <button class="btn" id="startCam" style="background:#fff;">📸 開啟相機實景</button>
        <button class="btn" id="toggleGrid" style="background:#444; color:#fff;">顯示/隱藏網格</button>
    </div>
    <div id="rec-btn"></div>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class SimARApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 3000);
            this.charGroups = [];
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            
            // 視角設定：稍微俯視，方便觀察 3D 路徑
            this.camera.position.set(0, 100, 350);
            this.camera.lookAt(0, 0, 0);

            // 1. 加入模擬地盤 (Grid Helper)
            this.grid = new THREE.GridHelper(400, 20, 0x00ffff, 0x333333);
            this.grid.position.y = -50;
            this.scene.add(this.grid);

            // 2. 初始化路徑球 (起點、轉角、終點)
            this.points = [
                this.createPoint(new THREE.Vector3(100, -30, 0), 0x00ff00), // 起 (綠)
                this.createPoint(new THREE.Vector3(0, 80, 50), 0xffff00),   // 彎 (黃)
                this.createPoint(new THREE.Vector3(-100, -30, 0), 0xff0000) // 終 (紅)
            ];

            // 拖拽控制
            this.drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            
            // 按鈕事件
            document.getElementById('startCam').onclick = () => this.enableCamera();
            document.getElementById('updateBtn').onclick = () => this.updateText();
            document.getElementById('toggleGrid').onclick = () => { this.grid.visible = !this.grid.visible; };
            document.getElementById('rec-btn').onclick = (e) => this.handleRecord(e.target);

            this.updateText();
            this.animate();
        }

        async enableCamera() {
            const video = document.getElementById('video-source');
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = s;
                video.play();
                this.scene.background = new THREE.VideoTexture(video);
                this.grid.visible = false; // 開啟相機後自動隱藏網格
                this.camera.position.set(0, 0, 300); // 調整回正視視角
            } catch (e) { alert("請授權相機權限"); }
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(12), 
                new THREE.MeshBasicMaterial({ color: color, depthTest: false, transparent: true, opacity: 0.9 })
            );
            m.position.copy(pos);
            m.renderOrder = 999;
            this.scene.add(m);
            return m;
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c);
                g.userData.tOffset = -i * 0.25; 
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createCharGroup(char) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            for (let j = 0; j < 25; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(25, 25), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                m.position.z = -j * 0.35;
                m.material.color.setScalar(0.4 + 0.6 * (1 - j/25));
                g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const time = Date.now() * 0.0008;
            this.charGroups.forEach(g => {
                let t = (time + g.userData.tOffset) % 2.0 - 0.5; 
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    const tan = curve.getTangentAt(t).normalize();
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(tan));
                    g.rotateY(Math.PI / 2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        handleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = [];
                const stream = this.renderer.domElement.captureStream(30);
                this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const blob = new Blob(this.chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = 'ar_sim_record.webm'; a.click();
                };
                this.recorder.start();
                btn.classList.add('recording');
            } else {
                this.recorder.stop();
                btn.classList.remove('recording');
            }
        }
    }
    new SimARApp();
</script>
</body>
</html>
