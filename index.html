<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mercedes-Benz Path Editor</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #app-ui {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 12px; border: 1px solid #e0e0e0;
            display: flex; gap: 8px; width: 280px;
        }
        input { flex: 1; padding: 8px; border-radius: 6px; border: none; background: #222; color: #fff; }
        button { padding: 8px 12px; border-radius: 6px; border: none; background: #e0e0e0; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-ui">
    <input type="text" id="textInput" value="MERCEDES-BENZ">
    <button id="updateBtn">更新</button>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class PathEditorApp {
        constructor() {
            // --- 🔧 妳可以在這裡「畫」妳的路徑 ---
            this.pathConfig = {
                startX: 80,    // 起點（右側牆深處）
                pivotX: 10,    // 轉折點 X 座標 (貓頭的位置)
                pivotZ: 0,     // 轉折點 Z 座標
                endZ: -100,    // 終點（左側牆深處）
                speed: 0.1,
                fontSize: 320
            };

            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            this.camera.position.set(80, 40, 100); 
            this.controls = new OrbitControls(this.camera, this.renderer.domElement);
            this.controls.enableDamping = true;

            // 輔助線：讓妳看清楚起點、轉點、終點
            const points = [
                new THREE.Vector3(this.pathConfig.startX, 0, 0),
                new THREE.Vector3(this.pathConfig.pivotX, 0, this.pathConfig.pivotZ),
                new THREE.Vector3(this.pathConfig.pivotX, 0, this.pathConfig.endZ)
            ];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
            this.scene.add(new THREE.Line(lineGeo, lineMat));

            this.scene.add(new THREE.AmbientLight(0xffffff, 4));
            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.pathConfig.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(10, 10);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < 40; j++) {
                    const color = new THREE.Color(0xe0e0e0);
                    color.multiplyScalar(0.2 + 0.8 * Math.pow(1 - j/40, 1.5));
                    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, color: color, alphaTest: 0.2 });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.1); 
                    group.add(m);
                }

                const spacing = 12;
                group.userData = { 
                    state: 'line1', 
                    offset: i * spacing 
                };
                // 初始位置設定
                group.position.set(this.pathConfig.startX + group.userData.offset, 5, 0);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.controls.update();

            const cfg = this.pathConfig;

            this.charGroups.forEach(g => {
                if (g.userData.state === 'line1') {
                    g.position.x -= cfg.speed;
                    // 當字體到達轉折點
                    if (g.position.x <= cfg.pivotX) {
                        g.userData.state = 'line2';
                        g.rotation.y = -Math.PI / 2; // 瞬間轉向 90 度
                        g.position.x = cfg.pivotX;
                    }
                } else {
                    g.position.z -= cfg.speed;
                }

                // 重生
                if (g.position.z < cfg.endZ) {
                    g.userData.state = 'line1';
                    g.rotation.y = 0;
                    const maxNextX = Math.max(...this.charGroups.map(ch => ch.position.x), cfg.pivotX + 20);
                    g.position.set(maxNextX + 12, 5, 0);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new PathEditorApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
