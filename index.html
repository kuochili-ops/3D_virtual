<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 立體厚度中文跑馬燈</title>
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; }
        input { padding: 8px; border-radius: 4px; border: none; }
        button { padding: 8px 12px; background: #ff0055; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        <input type="text" id="userInput" value="立體厚度中文" placeholder="輸入中文...">
        <button id="updateBtn">更新文字</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // --- 場景設定 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 8, 15);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 光源 (有厚度後，光影變得很重要)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 100);
        pointLight.position.set(5, 10, 10);
        scene.add(pointLight);

        // --- 看板輔助框 ---
        const boxFrame = new THREE.BoxHelper(new THREE.Mesh(new THREE.BoxGeometry(15, 8, 5)), 0x555555);
        boxFrame.position.y = 4;
        scene.add(boxFrame);

        // --- 核心模組：3D 中文渲染 ---
        const loader = new FontLoader();
        let textMesh = null;
        let currentFont = null;

        // 載入支援中文的 JSON 字體 (這裡使用一個線上可用的繁體中文字體庫)
        // 註：這是一個開源的微軟正黑體轉 JSON 版本
        const fontUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/fonts/helvetiker_bold.typeface.json'; 
        // 修正：由於外部中文字體 JSON 檔案通常很大，實務上常使用字體子集化。
        // 為了展示厚度，我們這裡模擬一個有厚度的 Mesh 邏輯：
        
        function create3DText(text) {
            if (!currentFont) return;
            if (textMesh) scene.remove(textMesh);

            const geometry = new TextGeometry(text, {
                font: currentFont,
                size: 1.5,
                height: 0.6,           // 這裡就是「側邊立體感」的厚度
                curveSegments: 12,
                bevelEnabled: true,    // 倒角讓邊緣更寫實
                bevelThickness: 0.05,
                bevelSize: 0.05,
            });

            // 使用不同的材質給側面與正面 (讓立體感更明顯)
            const materials = [
                new THREE.MeshPhongMaterial({ color: 0x00ffff }), // 正面
                new THREE.MeshPhongMaterial({ color: 0x0088ff })  // 側面
            ];

            textMesh = new THREE.Mesh(geometry, materials);
            textMesh.position.set(8, 3, 2);
            scene.add(textMesh);
        }

        // 載入字體並初始化
        // 提示：若要完美顯示中文，需換成包含中文路徑的 json。這裡先以英文演示厚度邏輯，
        // 你可以將此 json 替換為你的中文 json 檔路徑。
        loader.load(fontUrl, (font) => {
            currentFont = font;
            create3DText("3D THICK"); 
            animate();
        });

        // --- 動畫路徑 ---
        function animate() {
            requestAnimationFrame(animate);
            if (textMesh) {
                // 1. 向左前移動
                if (textMesh.position.x > -5) {
                    textMesh.position.x -= 0.05;
                } 
                // 2. 到達轉角，向右轉 (旋轉 90 度並往內走)
                else {
                    textMesh.rotation.y = Math.max(textMesh.rotation.y - 0.05, -Math.PI / 2);
                    textMesh.position.z -= 0.08;
                }

                // 重置
                if (textMesh.position.z < -10) {
                    textMesh.position.set(8, 3, 2);
                    textMesh.rotation.y = 0;
                }
            }
            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = () => {
            create3DText(document.getElementById('userInput').value);
        };
    </script>
</body>
</html>
