<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shinjuku Cat Angle App</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #app-ui {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px);
            padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column; gap: 8px; width: 220px;
        }
        input { padding: 8px; border-radius: 5px; border: none; background: rgba(0,0,0,0.5); color: #fff; }
        button { padding: 8px; border-radius: 5px; border: none; background: #00ffff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app-ui">
    <input type="text" id="textInput" value="新宿3D貓咪視角測試">
    <button id="updateBtn">更新內容</button>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    class ShinjukuApp {
        constructor() {
            this.config = { speed: 0.05, depth: 45, fontSize: 320, color: "#00ffcc" };
            this.scene = new THREE.Scene();
            // 廣角鏡頭，模擬拍照感
            this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // --- 視角修正：完全模仿妳照片中的拍攝站位 ---
            // 相機在右前方 (x=45, z=60)，高度適中 (y=25)
            this.camera.position.set(45, 25, 60); 
            this.camera.lookAt(-10, 0, -10); // 鏡頭焦點對準轉折處

            this.scene.add(new THREE.AmbientLight(0xffffff, 4));
            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(8, 8);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {};
                    color.getHSL(hsl);
                    if (j > 0) hsl.l *= (0.15 + 0.45 * Math.pow(1 - j/this.config.depth, 1.5));
                    else hsl.l = 1.0;
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.15, side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.08); 
                    if (j === 0) m.scale.set(1.05, 1.05, 1);
                    group.add(m);
                }

                // 起點：右方牆壁深處
                const spacing = 7;
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', 
                    xStart: 60 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 0, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const R = 22; // 轉彎半徑
            const cornerX = 0; 

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s; 
                    if (g.position.x <= cornerX) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    const slow = 1 - (Math.sin(g.userData.angle) * 0.5);
                    g.userData.angle += (s * slow / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall';
                    }
                } else {
                    g.position.z -= s; 
                }

                if (g.position.z < -100) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    // 自動循環
                    const maxCharX = Math.max(...this.charGroups.map(ch => ch.position.x), 50);
                    g.position.set(maxCharX + 7, 0, 0);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new ShinjukuApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
