<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR 3D Path Overlay</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        
        /* 底層：相機影像 */
        #video-bg {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 1; /* 最底層 */
        }

        /* 中層：3D 文字渲染區 */
        #three-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10; /* 覆蓋在影像之上 */
            pointer-events: auto; /* 允許點擊拖動控制球 */
        }

        /* 上層：UI 控制面板 */
        #app-ui {
            position: absolute; top: 20px; left: 20px;
            z-index: 100; /* 最上層 */
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 1px solid #00ffff;
            display: flex; flex-direction: column; gap: 10px; width: 220px;
        }
        label { color: #00ffff; font-size: 11px; font-weight: bold; }
        button { padding: 8px; border-radius: 6px; border: none; background: #00ffff; font-weight: bold; cursor: pointer; }
        input { padding: 8px; border-radius: 6px; border: none; background: #222; color: #fff; }
    </style>
</head>
<body>

<video id="video-bg" autoplay playsinline></video>
<div id="three-canvas"></div>

<div id="app-ui">
    <label>文字內容</label>
    <input type="text" id="textInput" value="MERCEDES-BENZ">
    <button id="startCam">1. 開啟相機</button>
    <button id="toggleDir">2. 切換文字方向</button>
    <div style="color: #fff; font-size: 10px; opacity: 0.6;">* 手指拖動青色球調整路徑</div>
</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    // 相機啟動
    document.getElementById('startCam').onclick = async () => {
        const video = document.getElementById('video-bg');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
    };

    class ARApp {
        constructor() {
            this.config = { speed: 0.0015, reverse: false };
            this.scene = new THREE.Scene();
            // 關鍵：alpha: true 讓 3D 背景透明
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            this.charGroups = [];
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-canvas').appendChild(this.renderer.domElement);
            
            this.camera.position.set(0, 30, 120);
            this.scene.add(new THREE.AmbientLight(0xffffff, 5));

            // 初始化路徑點
            this.points = [
                this.createPoint(new THREE.Vector3(60, 0, 0)),
                this.createPoint(new THREE.Vector3(0, 0, 0)),
                this.createPoint(new THREE.Vector3(0, 0, -60))
            ];

            const drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            drag.addEventListener('drag', () => this.updatePath());

            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('toggleDir').onclick = () => this.config.reverse = !this.config.reverse;

            this.updatePath();
            this.updateText();
            this.animate();
        }

        createPoint(pos) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(3), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 }));
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        updatePath() {
            this.curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = new THREE.Group();
                const tex = this.createTexture(c);
                for (let j = 0; j < 40; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.2, side: THREE.DoubleSide }));
                    m.position.z = -j * 0.12;
                    m.material.color.setScalar(0.3 + 0.7 * (1 - j/40));
                    g.add(m);
                }
                g.userData.tOffset = i * 0.14;
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createTexture(char) {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.font = 'bold 350px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const time = Date.now() * this.config.speed;
            this.charGroups.forEach(g => {
                let rawT = (time + g.userData.tOffset) % 1.6;
                let t = this.config.reverse ? (rawT - 0.3) : (1.3 - rawT);
                if (t >= 0 && t <= 1) {
                    const pos = this.curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(this.curve.getTangentAt(t)));
                    g.rotateY(this.config.reverse ? -Math.PI/2 : Math.PI/2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }
    new ARApp();
</script>
</body>
</html>
