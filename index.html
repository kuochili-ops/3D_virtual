<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlipBoardAR - True Color</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; touch-action: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; }
        
        /* 置頂按鈕區 - 強化感應 */
        #top-bar {
            position: fixed; top: 15px; left: 0; width: 100%; z-index: 100;
            display: flex; justify-content: center; gap: 12px; pointer-events: auto;
        }
        .btn-top { 
            background: #fff; color: #000; border: none; padding: 12px 24px; 
            border-radius: 30px; font-weight: bold; font-size: 14px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: auto;
        }

        #app-ui {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            transition: transform 0.3s ease; padding-bottom: env(safe-area-inset-bottom);
        }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; font-size: 13px; cursor: pointer; }
        .ui-content { padding: 5px 0 20px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .ui-row { width: 90%; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { flex: 2; background: #111; color: #fff; border: 1px solid #00ffff; padding: 12px; border-radius: 8px; font-size: 16px; }
        #rec-btn { width: 50px; height: 50px; border: 4px solid #fff; background: red; border-radius: 50%; }
        
        #media-input, video#hidden-video { display: none; }
    </style>
</head>
<body>

<div id="top-bar">
    <button class="btn-top" id="startCam" style="background:#00ffff;">📷 開啟相機</button>
    <button class="btn-top" id="openFile">📂 載入照片/影片</button>
</div>

<video id="hidden-video" playsinline muted loop></video>
<input type="file" id="media-input" accept="image/*,video/*">
<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">🔽 控制面板</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="MERCEDES-BENZ">
            <input type="color" id="colorPicker" value="#ffffff" style="width:40px; height:40px; border:none; margin-left:10px;">
        </div>
        <div class="ui-row">
            <span style="color:#00ffff; font-size:12px;">流速</span>
            <input type="range" id="speedSlider" min="1" max="100" value="20" style="width: 35%;">
            <span style="color:#00ffff; font-size:12px;">字距</span>
            <input type="range" id="gapSlider" min="5" max="60" value="18" style="width: 35%;">
        </div>
        <div class="ui-row">
            <button style="background:#333; color:#fff; border:none; padding:12px; border-radius:8px; flex:1;" id="viewToggle">🔄 視角</button>
            <button style="background:#333; color:#fff; border:none; padding:12px; border-radius:8px; flex:1; margin:0 10px;" id="toggleGuide">👁️ 輔助</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    class ARColorApp {
        constructor() {
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            // 色彩修正核心：確保輸出與輸入一致
            this.renderer.outputColorSpace = THREE.SRGBColorSpace;
            this.renderer.toneMapping = THREE.NoToneMapping; 
            
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 3000);
            this.charGroups = [];
            this.flowSpeed = 0.0008;
            this.charGap = 0.18;
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);
            this.camera.position.set(0, 100, 500);

            this.grid = new THREE.GridHelper(800, 20, 0x00ffff, 0x222222);
            this.grid.position.y = -100;
            this.scene.add(this.grid);

            this.points = [
                this.createPoint(new THREE.Vector3(250, 0, -150), 0x00ff00),
                this.createPoint(new THREE.Vector3(0, 180, 150), 0xffff00),
                this.createPoint(new THREE.Vector3(-250, 0, -150), 0xff0000)
            ];

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => this.orbit.enabled = true);

            // 按鈕事件重綁
            document.getElementById('startCam').addEventListener('click', () => this.initCamera());
            document.getElementById('openFile').addEventListener('click', () => document.getElementById('media-input').click());
            document.getElementById('media-input').onchange = (e) => this.handleFile(e.target.files[0]);
            
            document.getElementById('toggleUI').onclick = () => {
                document.getElementById('app-ui').classList.toggle('collapsed');
            };

            document.getElementById('textInput').onchange = () => this.updateText();
            document.getElementById('speedSlider').oninput = (e) => this.flowSpeed = e.target.value * 0.00004;
            document.getElementById('gapSlider').oninput = (e) => this.charGap = e.target.value * 0.01;
            document.getElementById('rec-btn').onclick = (e) => this.toggleRecord(e.target);
            document.getElementById('toggleGuide').onclick = () => {
                const s = !this.grid.visible; this.grid.visible = s; this.points.forEach(p => p.visible = s);
            };

            this.updateText();
            this.animate();
        }

        fixAspect(texture) {
            if (!texture.image) return;
            const screenAspect = window.innerWidth / window.innerHeight;
            const imgW = texture.image.videoWidth || texture.image.width;
            const imgH = texture.image.videoHeight || texture.image.height;
            const imageAspect = imgW / imgH;
            
            texture.colorSpace = THREE.SRGBColorSpace; // 強制色彩空間轉換，防偏白
            texture.matrixAutoUpdate = false;
            if (imageAspect > screenAspect) {
                const scale = imageAspect / screenAspect;
                texture.matrix.setUvTransform(0, 0, 1, scale, 0, 0.5, 0.5);
            } else {
                const scale = screenAspect / imageAspect;
                texture.matrix.setUvTransform(0, 0, scale, 1, 0, 0.5, 0.5);
            }
            this.scene.background = texture;
        }

        async initCamera() {
            const video = document.getElementById('hidden-video');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: 1280 }, audio: false 
                });
                video.srcObject = stream;
                await video.play();
                const tex = new THREE.VideoTexture(video);
                this.fixAspect(tex);
                document.getElementById('startCam').innerText = "✅ 已同步";
            } catch (err) { alert("相機權限遭拒或不支援 HTTPS"); }
        }

        handleFile(file) {
            if (!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('image/')) {
                new THREE.TextureLoader().load(url, (t) => this.fixAspect(t));
            } else {
                const v = document.getElementById('hidden-video');
                v.srcObject = null; v.src = url; v.play().then(() => {
                    const tex = new THREE.VideoTexture(v);
                    this.fixAspect(tex);
                });
            }
        }

        createPoint(pos, color) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(25), new THREE.MeshBasicMaterial({ color, depthTest: false }));
            m.position.copy(pos); m.renderOrder = 999; this.scene.add(m); return m;
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            const color = document.getElementById('colorPicker').value;
            text.split('').forEach((c, i) => {
                const g = this.createCharGroup(c, color);
                g.userData.index = i; this.scene.add(g); this.charGroups.push(g);
            });
        }

        createCharGroup(char, color) {
            const g = new THREE.Group();
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 400px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = color; ctx.fillText(char, 256, 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            for (let j = 0; j < 10; j++) {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05 }));
                m.position.z = -j * 2; m.material.opacity = (1 - j/10); g.add(m);
            }
            return g;
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = (Date.now() * this.flowSpeed) % 2.0;
            this.charGroups.forEach(g => {
                let t = (baseTime - g.userData.index * this.charGap);
                while (t < 0) t += 2.0; t %= 2.0;
                if (t >= 0 && t <= 1) {
                    const pos = curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(curve.getTangentAt(t).normalize()));
                    g.rotateY(Math.PI/2); g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }

        toggleRecord(btn) {
            if (!this.recorder || this.recorder.state === "inactive") {
                this.chunks = []; const stream = this.renderer.domElement.captureStream(30);
                this.recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                this.recorder.ondataavailable = e => this.chunks.push(e.data);
                this.recorder.onstop = () => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob(this.chunks, { type: 'video/webm' }));
                    a.download = `Mercedes_Sync.webm`; a.click();
                };
                this.recorder.start(); btn.style.background = "#fff";
            } else { this.recorder.stop(); btn.style.background = "red"; }
        }
    }
    new ARColorApp();
</script>
</body>
</html>
