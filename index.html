<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Shinjuku 3D App</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #app-ui {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 12px; border-radius: 12px; border: 1px solid #00ffff;
            display: flex; gap: 8px; align-items: center;
        }
        input { padding: 8px; border-radius: 6px; border: none; background: #222; color: #fff; width: 140px; }
        button { padding: 8px 12px; border-radius: 6px; border: none; background: #00ffff; font-weight: bold; cursor: pointer; }
        #hint { position: absolute; bottom: 15px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

<div id="app-ui">
    <input type="text" id="textInput" value="手動挪動觀察位置" placeholder="輸入文字...">
    <button id="updateBtn">更新</button>
</div>
<div id="hint">手動滑動螢幕可旋轉視角，縮放可調整距離</div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class InteractiveShinjukuApp {
        constructor() {
            this.config = { speed: 0.06, depth: 45, fontSize: 300, color: "#00ffcc" };
            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.charGroups = [];
            
            this.init();
            this.animate();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(this.renderer.domElement);

            // 初始設為妳照片中的預設仰拍角度
            this.camera.position.set(60, 30, 70); 
            
            // 加入軌道控制器：讓妳可以自己挪動
            this.controls = new OrbitControls(this.camera, this.renderer.domElement);
            this.controls.enableDamping = true; // 增加滑動的平滑感
            this.controls.dampingFactor = 0.05;

            this.scene.add(new THREE.AmbientLight(0xffffff, 4));
            
            // 畫出一個簡單的地板參考線，方便妳確認「盒子」的位置
            const grid = new THREE.GridHelper(200, 20, 0x333333, 0x111111);
            grid.position.y = -5;
            this.scene.add(grid);

            this.update();

            window.addEventListener('resize', () => {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        update() {
            const text = document.getElementById('textInput').value || " ";
            this.buildBoard(text);
        }

        createTexture(char) {
            const res = 512;
            const canvas = document.createElement('canvas');
            canvas.width = res; canvas.height = res;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${this.config.fontSize}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = "white"; 
            ctx.fillText(char, res/2, res/2);
            return new THREE.CanvasTexture(canvas);
        }

        buildBoard(text) {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const chars = text.split('');
            const geometry = new THREE.PlaneGeometry(10, 10);

            chars.forEach((c, i) => {
                const group = new THREE.Group();
                const tex = this.createTexture(c);
                
                for (let j = 0; j < this.config.depth; j++) {
                    const color = new THREE.Color(this.config.color);
                    const hsl = {}; color.getHSL(hsl);
                    if (j > 0) hsl.l *= (0.15 + 0.45 * Math.pow(1 - j/this.config.depth, 1.4));
                    else hsl.l = 1.0;
                    color.setHSL(hsl.h, hsl.s, hsl.l);

                    const mat = new THREE.MeshBasicMaterial({ 
                        map: tex, transparent: true, color: color, alphaTest: 0.18, side: THREE.DoubleSide
                    });
                    const m = new THREE.Mesh(geometry, mat);
                    m.position.z = -(j * 0.1); 
                    group.add(m);
                }

                const spacing = 10;
                group.userData = { 
                    angle: 0, 
                    state: 'right-wall', 
                    xStart: 80 + (i * spacing), 
                    zStart: 0 
                };
                group.position.set(group.userData.xStart, 5, group.userData.zStart);
                this.scene.add(group);
                this.charGroups.push(group);
            });
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.controls.update(); // 更新控制器狀態

            const R = 25; 
            const cornerX = 0; 

            this.charGroups.forEach(g => {
                let s = this.config.speed;

                if (g.userData.state === 'right-wall') {
                    g.position.x -= s; 
                    if (g.position.x <= cornerX) g.userData.state = 'turning';
                } else if (g.userData.state === 'turning') {
                    g.userData.angle += (s / R);
                    if (g.userData.angle < Math.PI / 2) {
                        g.position.x = cornerX - R * Math.sin(g.userData.angle);
                        g.position.z = g.userData.zStart - R + R * Math.cos(g.userData.angle);
                        g.rotation.y = -g.userData.angle;
                    } else {
                        g.userData.state = 'left-wall';
                    }
                } else {
                    g.position.z -= s; 
                }

                if (g.position.z < -120) {
                    g.userData.state = 'right-wall';
                    g.userData.angle = 0;
                    g.rotation.y = 0;
                    const maxCharX = Math.max(...this.charGroups.map(ch => ch.position.x), 60);
                    g.position.set(maxCharX + 10, 5, 0);
                }
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new InteractiveShinjukuApp();
    document.getElementById('updateBtn').onclick = () => app.update();
</script>
</body>
</html>
