<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR 3D Path Recorder</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        /* 讓相機畫面填滿背景 */
        #video-bg {
            position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%;
            z-index: -1; object-fit: cover;
        }
        #app-ui {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3);
            display: flex; flex-direction: column; gap: 10px; width: 200px;
        }
        .rec-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff;
            background: red; cursor: pointer; z-index: 1000;
        }
        label { color: #fff; font-size: 11px; }
        input, button { padding: 6px; border-radius: 4px; border: none; }
    </style>
</head>
<body>

<video id="video-bg" autoplay playsinline></video>

<div id="app-ui">
    <label>文字</label>
    <input type="text" id="textInput" value="MERCEDES-BENZ">
    <button id="toggleDir">切換方向</button>
    <button id="startCam">開啟鏡頭</button>
</div>

<div class="rec-btn" id="recordBtn"></div>

<script type="importmap">
    { 
        "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        } 
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';

    // --- 相機啟動邏輯 ---
    async function initCamera() {
        const video = document.getElementById('video-bg');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: false 
            });
            video.srcObject = stream;
        } catch (err) {
            alert("無法開啟鏡頭，請確認權限設定");
        }
    }
    document.getElementById('startCam').onclick = initCamera;

    // --- 3D 引擎邏輯 (沿用妳優化的路徑引擎) ---
    class ARPathEngine {
        constructor() {
            this.config = { speed: 0.0015, depth: 35, reverse: false };
            this.scene = new THREE.Scene();
            // 使用透明背景，讓底下的 Video 露出來
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(this.renderer.domElement);
            this.camera.position.set(0, 20, 100);

            const light = new THREE.AmbientLight(0xffffff, 5);
            this.scene.add(light);

            this.points = [
                this.createPoint(new THREE.Vector3(50, 0, 0)),
                this.createPoint(new THREE.Vector3(0, 0, 0)),
                this.createPoint(new THREE.Vector3(0, 0, -50))
            ];

            this.drag = new DragControls(this.points, this.camera, this.renderer.domElement);
            this.updatePath();
            this.updateText();
            this.animate();

            document.getElementById('textInput').oninput = () => this.updateText();
            document.getElementById('toggleDir').onclick = () => this.config.reverse = !this.config.reverse;
        }

        createPoint(pos) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(2), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 }));
            m.position.copy(pos);
            this.scene.add(m);
            return m;
        }

        updatePath() {
            this.curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            this.drag.addEventListener('drag', () => {
                this.curve.v0.copy(this.points[0].position);
                this.curve.v1.copy(this.points[1].position);
                this.curve.v2.copy(this.points[2].position);
            });
        }

        updateText() {
            this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const g = new THREE.Group();
                const tex = this.createTexture(c);
                for (let j = 0; j < this.config.depth; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.2, side: THREE.DoubleSide }));
                    m.position.z = -j * 0.12;
                    m.material.color.setScalar(0.3 + 0.7 * (1 - j/this.config.depth));
                    g.add(m);
                }
                g.userData.tOffset = i * 0.15;
                this.scene.add(g);
                this.charGroups.push(g);
            });
        }

        createTexture(char) {
            const c = document.createElement('canvas'); c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            ctx.font = 'bold 350px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white'; ctx.fillText(char, 256, 256);
            return new THREE.CanvasTexture(c);
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            const time = Date.now() * this.config.speed;
            this.charGroups.forEach(g => {
                let rawT = (time + g.userData.tOffset) % 1.5;
                let t = this.config.reverse ? (rawT - 0.2) : (1.3 - rawT);
                if (t >= 0 && t <= 1) {
                    const pos = this.curve.getPointAt(t);
                    g.position.copy(pos);
                    g.lookAt(pos.clone().add(this.curve.getTangentAt(t)));
                    g.rotateY(this.config.reverse ? -Math.PI/2 : Math.PI/2);
                    g.visible = true;
                } else g.visible = false;
            });
            this.renderer.render(this.scene, this.camera);
        }
    }

    new ARPathEngine();
</script>
</body>
</html>
