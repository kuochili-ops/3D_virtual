<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 轉彎路徑強化版</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.85); padding: 18px; border-radius: 12px; color: white;
            border: 1px solid #555;
        }
        .row { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #444; width: 220px; background: #222; color: #fff; }
        input[type="color"] { border: none; width: 40px; height: 35px; cursor: pointer; background: none; }
        button { padding: 8px 15px; background: #ff0055; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .label { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="row">
            <input type="text" id="textInput" value="基隆市府安排免費接駁車" placeholder="輸入文字...">
            <button id="updateBtn">更新</button>
        </div>
        <div class="row">
            <span class="label">字體顏色：</span>
            <input type="color" id="colorPicker" value="#00ffff">
            <span class="label">背景：百貨公司外牆模式</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. 場景基礎 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 14, 25); // 調整視角，讓轉彎後的「深度」更明顯
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        
        // 增加一個「轉彎引導線」，讓您看清楚路徑
        const pathPoints = [
            new THREE.Vector3(20, 0.1, 4),
            new THREE.Vector3(-8, 0.1, 4),
            new THREE.Vector3(-10, 0.1, 2),
            new THREE.Vector3(-10, 0.1, -20)
        ];
        const pathGeom = new THREE.BufferGeometry().setFromPoints(pathPoints);
        const pathLine = new THREE.Line(pathGeom, new THREE.LineBasicMaterial({ color: 0x333333 }));
        scene.add(pathLine);

        // --- 2. 堆疊立體字產生器 ---
        function createStackedChar(char, baseColor) {
            const group = new THREE.Group();
            const layers = 35;
            const depthStep = 0.05;

            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 180px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 解析顏色以製作側面陰影
            const color = new THREE.Color(baseColor);
            
            for (let i = 0; i < layers; i++) {
                ctx.clearRect(0, 0, 256, 256);
                // 側面顏色隨深度變暗
                const l = 1.0 - (i * 0.02); 
                const layerColor = color.clone().multiplyScalar(i === 0 ? 1 : l);
                ctx.fillStyle = '#' + layerColor.getHexString();
                ctx.fillText(char, 128, 128);

                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), material);
                plane.position.z = -(i * depthStep);
                group.add(plane);
            }
            return group;
        }

        // --- 3. 跑馬燈邏輯 ---
        let charGroups = [];
        let currentConfig = {
            speed: 0.05,
            turnX: -8,
            spacing: 3.5
        };

        function startMarquee() {
            charGroups.forEach(g => scene.remove(g));
            charGroups = [];
            const text = document.getElementById('textInput').value;
            const color = document.getElementById('colorPicker').value;
            
            text.split('').forEach((c, i) => {
                const g = createStackedChar(c, color);
                g.position.set(20 + (i * currentConfig.spacing), 5, 4);
                scene.add(g);
                charGroups.push(g);
            });
        }

        // --- 4. 強化動畫：轉彎前進再消失 ---
        function animate() {
            requestAnimationFrame(animate);
            
            charGroups.forEach((group) => {
                if (group.position.x > currentConfig.turnX) {
                    // 直行
                    group.position.x -= currentConfig.speed;
                } else {
                    // 關鍵：轉彎動畫
                    // 1. 旋轉：向內轉 90 度
                    if (group.rotation.y > -Math.PI / 2) {
                        group.rotation.y -= 0.06; 
                    }
                    // 2. 前進：往 Z 軸深處走 (這是「消失」前的移動)
                    group.position.z -= currentConfig.speed * 2.5;
                    
                    // 3. 視覺消失：隨著距離變遠，縮小並變透明
                    if (group.position.z < -5) {
                        group.scale.multiplyScalar(0.98); // 逐漸縮小
                    }
                }

                // 循環重置
                if (group.position.z < -25) {
                    const lastX = Math.max(...charGroups.map(g => g.position.x));
                    group.position.set(lastX + currentConfig.spacing, 5, 4);
                    group.rotation.y = 0;
                    group.scale.set(1, 1, 1);
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = startMarquee;
        startMarquee();
        animate();
    </script>
</body>
</html>
