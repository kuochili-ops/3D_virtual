<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 轉彎前進實感模組</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; color: white;
            border: 1px solid #444;
        }
        .controls { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        input[type="text"] { padding: 8px; width: 200px; border-radius: 4px; border: none; }
        input[type="color"] { border: none; width: 30px; height: 30px; cursor: pointer; background: none; }
        button { padding: 8px 12px; background: #00ffff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui">
        <input type="text" id="textInput" value="基隆市府安排免費接駁車" placeholder="輸入文字...">
        <div class="controls">
            <span style="font-size: 12px;">顏色:</span>
            <input type="color" id="colorPicker" value="#00ffff">
            <button id="updateBtn">更新看板</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. 環境設定 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 調高視角並向後退，讓轉彎後的「深度路徑」變長
        camera.position.set(25, 15, 30);
        camera.lookAt(0, 5, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));

        // 建立一個「參考平面」，讓您感覺到地面的存在
        const grid = new THREE.GridHelper(60, 20, 0x333333, 0x222222);
        scene.add(grid);

        // 關鍵：在轉角處建立一個「消失門口」的輔助結構
        const wallGeo = new THREE.BoxGeometry(1, 10, 20);
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(-12, 5, -10); // 放在轉彎點左側
        scene.add(wall);

        // --- 2. 堆疊字產生器 ---
        function createStackedChar(char, baseColor) {
            const group = new THREE.Group();
            const layers = 30; 
            const depthStep = 0.05; // 厚度

            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 180px "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const color = new THREE.Color(baseColor);
            for (let i = 0; i < layers; i++) {
                ctx.clearRect(0, 0, 256, 256);
                const l = 1.0 - (i * 0.025); // 側面變暗
                ctx.fillStyle = '#' + color.clone().multiplyScalar(i === 0 ? 1 : l).getHexString();
                ctx.fillText(char, 128, 128);

                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), material);
                plane.position.z = -(i * depthStep);
                group.add(plane);
            }
            return group; group.userData = { originalZ: 5 }; // 紀錄起始 Z
        }

        // --- 3. 動畫與邏輯 ---
        let charGroups = [];
        const config = {
            speed: 0.1,     // 稍微加快一點以便觀察路徑
            turnX: -8,      // 轉彎啟動點
            spacing: 4.0    // 加大字距
        };

        function start() {
            charGroups.forEach(g => scene.remove(g));
            charGroups = [];
            const text = document.getElementById('textInput').value;
            const color = document.getElementById('colorPicker').value;
            text.split('').forEach((c, i) => {
                const g = createStackedChar(c, color);
                g.position.set(25 + (i * config.spacing), 5, 5);
                scene.add(g);
                charGroups.push(g);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            charGroups.forEach((group) => {
                if (group.position.x > config.turnX) {
                    // 直行
                    group.position.x -= config.speed;
                } else {
                    // 轉彎階段
                    // 1. 平滑轉向：旋轉速度與前進速度掛鉤
                    if (group.rotation.y > -Math.PI / 2) {
                        group.rotation.y -= 0.08; 
                    }
                    
                    // 2. 轉彎後前進：往 Z 軸深處（-Z方向）大幅移動
                    group.position.z -= config.speed * 2.5; 
                    
                    // 3. 轉彎補償：為了讓它看起來是繞著牆角轉，X 也要微調
                    group.position.x -= 0.01;

                    // 4. 縮小與淡出：模擬遠去感
                    if (group.position.z < -2) {
                        group.scale.multiplyScalar(0.985);
                    }
                }

                // 重置循環
                if (group.position.z < -25) {
                    const lastX = Math.max(...charGroups.map(g => g.position.x));
                    group.position.set(lastX + config.spacing, 5, 5);
                    group.rotation.y = 0;
                    group.scale.set(1, 1, 1);
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('updateBtn').onclick = start;
        start();
        animate();
    </script>
</body>
</html>
