<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FlipBoardAR Classic AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Long+Cang&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; height: 100vh; }
        
        /* 🛠️ 關鍵：背景層獨立，使用 CSS 解決拉伸與爆大問題 */
        #media-bg { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 1; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        #bg-video, #bg-image { width: 100%; height: 100%; object-fit: cover; display: none; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: auto; }
        
        #app-ui { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); transition: transform 0.3s; border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom); }
        #app-ui.collapsed { transform: translateY(calc(100% - 40px)); }
        
        .tab-handle { height: 40px; display: flex; justify-content: center; align-items: center; color: #00ffff; cursor: pointer; font-weight: bold; }
        .ui-content { padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .ui-row { width: 92%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .btn { flex: 1; height: 40px; background: #333; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 12px; }
        .btn-active { background: #00ffff !important; color: #000 !important; }
        #rec-btn { width: 50px; height: 50px; border: 3px solid #fff; background: #ff0000; border-radius: 50%; }
        #stop-rec-overlay { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); z-index: 500; background: #ff0000; color: white; padding: 12px 30px; border-radius: 50px; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div id="stop-rec-overlay">⏹ 停止錄製</div>

<div id="media-bg">
    <video id="bg-video" autoplay playsinline muted></video>
    <img id="bg-image">
</div>

<div id="canvas-container"></div>

<div id="app-ui">
    <div class="tab-handle" id="toggleUI">一一一 MENU 一一一</div>
    <div class="ui-content">
        <div class="ui-row">
            <input type="text" id="textInput" value="3D 操作回歸" style="flex:1.5; padding:10px; border-radius:5px; border:1px solid #0ff; background:#111; color:#fff;">
            <input type="color" id="colorPicker" value="#ffffff" style="width:40px; height:40px; border:none; background:none;">
            <button class="btn" id="fontToggle" style="flex:0.5">字型</button>
        </div>
        <div class="ui-row">
            <button class="btn" id="camBtn">📷 啟動相機</button>
            <button class="btn" id="openAlbum">📂 換照片</button>
            <button class="btn" id="toggleGuide" style="flex:0.3">👁️</button>
            <div id="rec-btn"></div>
        </div>
    </div>
</div>

<input type="file" id="media-input" accept="image/*" style="display:none;">

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
    import * as THREE from 'three';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    class ARClassicFix {
        constructor() {
            this.scene = new THREE.Scene();
            this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
            
            this.params = { speed: 1.0, spacing: 0.15, helpers: true, fontIdx: 0, fontStyles: ['900 400px "Noto Serif TC"', '400 400px "Long Cang"', '400 400px "ZCOOL QingKe HuangYou"', '900 400px "Noto Sans TC"'] };
            this.init();
        }

        init() {
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(this.renderer.domElement);

            // 🛠️ 回歸經典視角：俯視且有深度
            this.camera.position.set(0, 400, 1200);
            this.camera.lookAt(0, 0, 0);

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;
            
            // 經典水平網格
            this.grid = new THREE.GridHelper(2000, 20, 0x00ffff, 0x333333);
            this.scene.add(this.grid);
            
            // 經典球位：在畫面中心稍微靠前
            this.points = [
                this._createPoint(new THREE.Vector3(-350, 150, 0), 0x00ff00),
                this._createPoint(new THREE.Vector3(0, 500, 200), 0xffff00),
                this._createPoint(new THREE.Vector3(350, 150, 0), 0xff0000)
            ];
            
            this.drag = new DragControls([...this.points], this.camera, this.renderer.domElement);
            this.drag.addEventListener('dragstart', () => this.orbit.enabled = false);
            this.drag.addEventListener('dragend', () => this.orbit.enabled = true);

            this._bindUI();
            this.updateText();
            this._renderLoop();
        }

        _bindUI() {
            const get = (id) => document.getElementById(id);
            get('camBtn').onclick = () => this.startCamera();
            get('openAlbum').onclick = () => get('media-input').click();
            get('media-input').onchange = (e) => {
                const i = document.getElementById('bg-image');
                i.src = URL.createObjectURL(e.target.files[0]);
                i.style.display = 'block';
                document.getElementById('bg-video').style.display = 'none';
            };
            get('toggleGuide').onclick = () => {
                this.params.helpers = !this.params.helpers;
                this.grid.visible = this.params.helpers;
                this.points.forEach(p => p.visible = this.params.helpers);
            };
            get('rec-btn').onclick = () => this.startRecording();
            get('stop-rec-overlay').onclick = () => this.stopRecording();
            get('toggleUI').onclick = () => get('app-ui').classList.toggle('collapsed');
            get('fontToggle').onclick = () => { this.params.fontIdx = (this.params.fontIdx+1)%4; this.updateText(); };
            get('textInput').oninput = () => this.updateText();
            get('colorPicker').oninput = () => this.updateText();
        }

        async startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const v = document.getElementById('bg-video');
            v.srcObject = stream;
            v.style.display = 'block';
            document.getElementById('bg-image').style.display = 'none';
        }

        _renderLoop() {
            requestAnimationFrame(() => this._renderLoop());
            this.orbit.update();
            this._animateText();
            this.renderer.render(this.scene, this.camera);
        }

        // 🛠️ 錄影時將背景與 3D 合併 (錄製專用畫布)
        startRecording() {
            this.isRecording = true;
            document.getElementById('stop-rec-overlay').style.display = 'block';
            document.getElementById('app-ui').classList.add('collapsed');
            
            // 建立錄影專用大畫布，將影片與 3D 畫布重疊繪製
            const recCanvas = document.createElement('canvas');
            recCanvas.width = this.renderer.domElement.width;
            recCanvas.height = this.renderer.domElement.height;
            const recCtx = recCanvas.getContext('2d');

            const captureStream = recCanvas.captureStream(30);
            this.mediaRecorder = new MediaRecorder(captureStream, { mimeType: 'video/webm' });
            this.chunks = [];
            this.mediaRecorder.ondataavailable = e => this.chunks.push(e.data);
            this.mediaRecorder.onstop = () => {
                const blob = new Blob(this.chunks, { type: 'video/webm' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'AR_Works.webm'; a.click();
            };

            const recordFrame = () => {
                if (!this.isRecording) return;
                recCtx.fillStyle = "#000";
                recCtx.fillRect(0,0,recCanvas.width, recCanvas.height);
                
                // 畫背景
                const bg = document.getElementById('bg-video').style.display === 'block' ? document.getElementById('bg-video') : document.getElementById('bg-image');
                if (bg && (bg.videoWidth || bg.naturalWidth)) {
                    const bw = bg.videoWidth || bg.naturalWidth;
                    const bh = bg.videoHeight || bg.naturalHeight;
                    const s = Math.max(recCanvas.width/bw, recCanvas.height/bh);
                    recCtx.drawImage(bg, (recCanvas.width-bw*s)/2, (recCanvas.height-bh*s)/2, bw*s, bh*s);
                }
                // 畫 3D
                recCtx.drawImage(this.renderer.domElement, 0, 0);
                requestAnimationFrame(recordFrame);
            };
            
            this.mediaRecorder.start();
            recordFrame();
        }

        stopRecording() {
            this.isRecording = false;
            this.mediaRecorder.stop();
            document.getElementById('stop-rec-overlay').style.display = 'none';
        }

        _createPoint(pos, color) { const m = new THREE.Mesh(new THREE.SphereGeometry(40), new THREE.MeshBasicMaterial({ color })); m.position.copy(pos); this.scene.add(m); return m; }
        
        async updateText() {
            const style = this.params.fontStyles[this.params.fontIdx];
            if (!document.fonts.check(style)) await document.fonts.load(style);
            if (this.charGroups) this.charGroups.forEach(g => this.scene.remove(g));
            this.charGroups = [];
            const text = document.getElementById('textInput').value || "";
            text.split('').forEach((c, i) => {
                const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.font = style; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = document.getElementById('colorPicker').value; ctx.fillText(c, 256, 256);
                const tex = new THREE.CanvasTexture(canvas);
                const g = new THREE.Group();
                for (let j = 0; j < 15; j++) {
                    const m = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 }));
                    m.position.z = -j * 2.5; g.add(m);
                }
                this.scene.add(g); this.charGroups.push(g);
            });
        }
        _animateText() {
            const curve = new THREE.QuadraticBezierCurve3(this.points[0].position, this.points[1].position, this.points[2].position);
            const baseTime = Date.now() * 0.0008;
            this.charGroups?.forEach((g, i) => {
                let t = (baseTime - i * this.params.spacing) % 2.5 - 0.5;
                if (t >= 0 && t <= 1) { const pos = curve.getPointAt(t); g.position.copy(pos); g.lookAt(pos.clone().add(curve.getTangentAt(t))); g.rotateY(Math.PI / 2); g.visible = true; } else g.visible = false;
            });
        }
    }
    window.onload = () => new ARClassicFix();
</script>
</body>
</html>
