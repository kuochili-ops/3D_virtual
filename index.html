<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D 中文立體跑馬燈模擬器</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui-container {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px;
            backdrop-filter: blur(5px); color: white;
        }
        input { padding: 8px; border: none; border-radius: 4px; width: 200px; }
        button { padding: 8px 15px; cursor: pointer; background: #00ffff; border: none; border-radius: 4px; font-weight: bold; }
        
        /* 跑馬燈文字樣式 */
        .marquee-text {
            color: #00ffff;
            font-size: 50px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #0088ff;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <input type="text" id="userInput" placeholder="輸入中文內容..." value="跨時空 3D 看板">
        <button id="sendBtn">發送文字</button>
        <p style="font-size: 12px; opacity: 0.7;">視角：模擬街頭仰視</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 1. 場景基礎設定 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 模擬照片中的仰視視角
        camera.position.set(15, 10, 20);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. CSS2D 渲染器 (處理中文的關鍵) ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 3. 建立虛擬看板框架 (輔助視覺) ---
        const grid = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        scene.add(grid);

        // --- 4. 跑馬燈核心模組 ---
        let marqueeObject = null;
        const startPos = { x: 15, y: 5, z: 2 };  // 右後方
        const turnPos = { x: -8, y: 5, z: 2 }; // 左前方轉折點
        
        function createMarquee(content) {
            if (marqueeObject) {
                scene.remove(marqueeObject);
            }

            const div = document.createElement('div');
            div.className = 'marquee-text';
            div.textContent = content;

            marqueeObject = new CSS2DObject(div);
            marqueeObject.position.set(startPos.x, startPos.y, startPos.z);
            scene.add(marqueeObject);
        }

        // --- 5. 動畫與路徑邏輯 ---
        function animate() {
            requestAnimationFrame(animate);

            if (marqueeObject) {
                // 移動邏輯：如果還沒到左邊，就向左走
                if (marqueeObject.position.x > turnPos.x) {
                    marqueeObject.position.x -= 0.08; 
                } 
                // 到達左邊後，向右轉 (往 z 軸深處消失)
                else {
                    marqueeObject.position.z -= 0.08;
                    // 稍微淡出效果 (CSS 處理)
                    marqueeObject.element.style.opacity = Math.max(0, (marqueeObject.position.z + 5) / 5);
                }

                // 循環重置
                if (marqueeObject.position.z < -10) {
                    marqueeObject.position.set(startPos.x, startPos.y, startPos.z);
                    marqueeObject.element.style.opacity = 1;
                }
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // 綁定按鈕
        document.getElementById('sendBtn').onclick = () => {
            const val = document.getElementById('userInput').value;
            createMarquee(val);
        };

        // 視窗縮放處理
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        };

        // 初始化執行
        createMarquee("裸眼 3D 效果模擬");
        animate();
    </script>
</body>
</html>
